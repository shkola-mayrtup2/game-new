<script>

const IS_MOBILE = IS_TOUCH && Math.min(innerWidth, innerHeight) < 900;
const WORLD_HALF = 80;

let scene, camera, renderer;
let carGroup, wheels = [];
let keys = {};
let state = 'splash';
let splashStart = 0;
let gameTime = 0;
let maxSpeedReached = 0;
let distanceDriven = 0;
let shakeAmount = 0;

let obstacles = [];
let pickupItems = [];

try { const r = localStorage.getItem('carGameRecords'); if (r) records = Object.assign(records, JSON.parse(r)); } catch(e){}

// ============================================
//   ТЕКСТУРЫ — плавные, с градиентами
// ============================================
function makeTex(w, h, drawFn, repeatX, repeatY) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = true;
  drawFn(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  t.minFilter = THREE.LinearMipMapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = true;
  if (repeatX) t.repeat.set(repeatX, repeatY || repeatX);
  return t;
}

const grassTex = makeTex(128, 128, (g, w, h) => {
  // Плавный градиент зелёного
  const baseGrad = g.createLinearGradient(0, 0, w, h);
  baseGrad.addColorStop(0, '#4a7c3a');
  baseGrad.addColorStop(0.5, '#528840');
  baseGrad.addColorStop(1, '#3f6b30');
  g.fillStyle = baseGrad;
  g.fillRect(0, 0, w, h);
  
  // Мягкие пятна
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 4 + Math.random() * 12;
    const radGrad = g.createRadialGradient(x, y, 0, x, y, r);
    radGrad.addColorStop(0, 'rgba(90,150,60,0.4)');
    radGrad.addColorStop(1, 'rgba(90,150,60,0)');
    g.fillStyle = radGrad;
    g.fillRect(x - r, y - r, r*2, r*2);
  }
  
  // Травинки
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    g.strokeStyle = `rgba(${70 + Math.random()*40},${120 + Math.random()*40},${50 + Math.random()*30},0.5)`;
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + (Math.random()-0.5)*3, y - 2 - Math.random()*3);
    g.stroke();
  }
}, 30, 30);

const asphaltTex = makeTex(128, 128, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#3a3a3a');
  grad.addColorStop(1, '#343434');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, h);
  
  // Мягкие пятна
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 8 + Math.random() * 20;
    const radGrad = g.createRadialGradient(x, y, 0, x, y, r);
    radGrad.addColorStop(0, 'rgba(70,70,70,0.3)');
    radGrad.addColorStop(1, 'rgba(70,70,70,0)');
    g.fillStyle = radGrad;
    g.fillRect(x - r, y - r, r*2, r*2);
  }
  
  // Мелкие точки
  for (let i = 0; i < 400; i++) {
    const s = 45 + Math.random() * 40;
    g.fillStyle = `rgba(${s},${s},${s},0.6)`;
    g.fillRect(Math.random()*w, Math.random()*h, 1, 1);
  }
});

const brickTex = makeTex(128, 128, (g, w, h) => {
  g.fillStyle = '#7a4020';
  g.fillRect(0, 0, w, h);
  const bh = 16, bw = 32;
  for (let y = 0; y < h; y += bh) {
    const off = (y/bh) % 2 ? bw/2 : 0;
    for (let x = -bw; x < w + bw; x += bw) {
      const grad = g.createLinearGradient(x+off, y, x+off, y+bh);
      grad.addColorStop(0, '#c47a4a');
      grad.addColorStop(0.5, '#b86b3a');
      grad.addColorStop(1, '#a05a2a');
      g.fillStyle = grad;
      g.fillRect(x+off+1, y+1, bw-2, bh-2);
    }
  }
});

const roofTex = makeTex(64, 64, (g, w, h) => {
  g.fillStyle = '#8b2f2f';
  g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 8) {
    const grad = g.createLinearGradient(x, 0, x+8, 0);
    grad.addColorStop(0, '#7a2525');
    grad.addColorStop(0.5, '#9a3535');
    grad.addColorStop(1, '#7a2525');
    g.fillStyle = grad;
    g.fillRect(x, 0, 8, h);
  }
});

const woodTex = makeTex(64, 128, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, w, 0);
  grad.addColorStop(0, '#5a3a1a');
  grad.addColorStop(0.5, '#6a4a2a');
  grad.addColorStop(1, '#4a2a0a');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 15; i++) {
    g.strokeStyle = `rgba(30,15,5,${0.2 + Math.random()*0.3})`;
    g.lineWidth = 1;
    g.beginPath();
    const x = Math.random() * w;
    g.moveTo(x, 0);
    g.bezierCurveTo(x+3, h*0.33, x-3, h*0.66, x+2, h);
    g.stroke();
  }
});

// Машина — с реалистичными блеском
const carBodyTex = makeTex(256, 256, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#ff5560');
  grad.addColorStop(0.3, '#e63946');
  grad.addColorStop(0.7, '#c1272d');
  grad.addColorStop(1, '#a4161a');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, h);
  
  // Блик сверху
  const glare = g.createLinearGradient(0, 0, 0, h*0.4);
  glare.addColorStop(0, 'rgba(255,255,255,0.35)');
  glare.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = glare;
  g.fillRect(0, 0, w, h*0.4);
  
  // Тёмная полоса снизу
  const shadow = g.createLinearGradient(0, h*0.7, 0, h);
  shadow.addColorStop(0, 'rgba(0,0,0,0)');
  shadow.addColorStop(1, 'rgba(0,0,0,0.4)');
  g.fillStyle = shadow;
  g.fillRect(0, h*0.7, w, h*0.3);
  
  // Полоса двери
  g.strokeStyle = 'rgba(0,0,0,0.4)';
  g.lineWidth = 3;
  g.beginPath();
  g.moveTo(w/2, 0);
  g.lineTo(w/2, h);
  g.stroke();
});

// ============================================
//   ИНИЦИАЛИЗАЦИЯ 3D
// ============================================
function init3D() {
  scene = new THREE.Scene();
  // Красивое небо с градиентом
  const skyColor = 0x87ceeb;
  scene.background = new THREE.Color(skyColor);
  scene.fog = new THREE.Fog(skyColor, 90, 240);

  camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 900);
  camera.position.set(0, 5.5, -9);

  renderer = new THREE.WebGLRenderer({ 
    antialias: !IS_MOBILE,
    powerPreference: 'high-performance',
    stencil: false,
    depth: true,
  });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, IS_MOBILE ? 1.5 : 2));
  renderer.shadowMap.enabled = !IS_MOBILE && settings.graphics === 'high';
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  // Свет
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  
  const sun = new THREE.DirectionalLight(0xfff4d6, 1.1);
  sun.position.set(50, 80, 40);
  sun.castShadow = !IS_MOBILE && settings.graphics === 'high';
  if (sun.castShadow) {
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -100, right: 100, top: 100, bottom: -100, near: 1, far: 300 });
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.02;
  }
  scene.add(sun);
  
  scene.add(new THREE.HemisphereLight(0x87ceeb, 0x4a7c3a, 0.45));

  // Солнце
  const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(5, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xffffcc })
  );
  sunMesh.position.set(150, 180, 100);
  scene.add(sunMesh);
  
  // Ореол солнца
  const sunGlow = new THREE.Mesh(
    new THREE.SphereGeometry(10, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffeeaa, transparent: true, opacity: 0.25 })
  );
  sunGlow.position.copy(sunMesh.position);
  scene.add(sunGlow);

  // Облака
  for (let i = 0; i < 20; i++) {
    const cloud = new THREE.Group();
    const cloudSize = 2 + Math.random()*2.5;
    for (let j = 0; j < 5; j++) {
      const puff = new THREE.Mesh(
        new THREE.SphereGeometry(cloudSize * (0.7 + Math.random()*0.4), 10, 10),
        new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })
      );
      puff.position.set(j*2.2-4 + Math.random()*1.5, Math.random()*1, Math.random()*2-1);
      cloud.add(puff);
    }
    cloud.position.set(-200 + Math.random()*400, 50 + Math.random()*30, -200 + Math.random()*400);
    scene.add(cloud);
  }

  createGround();
  createRoads();
  createHouses();
  createGasStation();
  createParkedCars();
  createTreesAndBridges();
  createStreetLamps();
  createPickups();
  createCar();

  addEventListener('resize', onResize);
  onResize();
}

// ============================================
//   ЗЕМЛЯ
// ============================================
function createGround() {
  const grassMat = new THREE.MeshLambertMaterial({ map: grassTex });
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_HALF*2 + 30, WORLD_HALF*2 + 30), grassMat);
  grass.rotation.x = -Math.PI / 2;
  grass.receiveShadow = !IS_MOBILE;
  scene.add(grass);

  const wallMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
  const W = WORLD_HALF;
  for (const [x,y,z,w,h,d] of [
    [0, 0.7, -W, W*2, 1.4, 0.5],
    [0, 0.7, W, W*2, 1.4, 0.5],
    [-W, 0.7, 0, 0.5, 1.4, W*2],
    [W, 0.7, 0, 0.5, 1.4, W*2],
  ]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
    wall.position.set(x,y,z);
    wall.castShadow = !IS_MOBILE;
    wall.receiveShadow = !IS_MOBILE;
    scene.add(wall);
    obstacles.push({ x, z, w, d });
  }
}

// ============================================
//   ДОРОГИ
// ============================================
function createRoads() {
  const roadMat = new THREE.MeshLambertMaterial({ map: asphaltTex });
  const roadWidth = 10;
  const W = WORLD_HALF;
  const roadZs = [-50, -25, 0, 25, 50];
  const roadXs = [-50, -25, 0, 25, 50];

  for (const z of roadZs) {
    const road = new THREE.Mesh(new THREE.PlaneGeometry(W*2, roadWidth), roadMat.clone());
    road.material.map = asphaltTex.clone();
    road.material.map.repeat.set(W/3, 2);
    road.material.map.needsUpdate = true;
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0.01, z);
    road.receiveShadow = !IS_MOBILE;
    scene.add(road);
  }
  for (const x of roadXs) {
    const road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, W*2), roadMat.clone());
    road.material.map = asphaltTex.clone();
    road.material.map.repeat.set(2, W/3);
    road.material.map.needsUpdate = true;
    road.rotation.x = -Math.PI / 2;
    road.position.set(x, 0.01, 0);
    road.receiveShadow = !IS_MOBILE;
    scene.add(road);
  }

  // Разметка
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
  for (const z of roadZs) {
    for (let i = -W + 3; i <= W - 3; i += 5) {
      let skip = false;
      for (const rx of roadXs) if (Math.abs(i - rx) < 6) skip = true;
      if (skip) continue;
      const line = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 0.25), lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(i, 0.02, z);
      scene.add(line);
    }
  }
  for (const x of roadXs) {
    for (let i = -W + 3; i <= W - 3; i += 5) {
      let skip = false;
      for (const rz of roadZs) if (Math.abs(i - rz) < 6) skip = true;
      if (skip) continue;
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 2.5), lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.02, i);
      scene.add(line);
    }
  }

  // Бордюры
  const curbMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
  const roadHalf = roadWidth / 2 + 0.15;
  for (const z of roadZs) {
    for (const dz of [-roadHalf, roadHalf]) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(W*2, 0.15, 0.3), curbMat);
      c.position.set(0, 0.075, z + dz);
      c.receiveShadow = !IS_MOBILE;
      scene.add(c);
    }
  }
  for (const x of roadXs) {
    for (const dx of [-roadHalf, roadHalf]) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, W*2), curbMat);
      c.position.set(x + dx, 0.075, 0);
      c.receiveShadow = !IS_MOBILE;
      scene.add(c);
    }
  }
}

// ============================================
//   ДОМА
// ============================================
function createHouses() {
  const wallMat = new THREE.MeshLambertMaterial({ map: brickTex });
  const roofMat = new THREE.MeshLambertMaterial({ map: roofTex });
  const winMat = new THREE.MeshLambertMaterial({ 
    color: 0x9ad0ff, emissive: 0x3a6080, emissiveIntensity: 0.3
  });
  const doorMat = new THREE.MeshLambertMaterial({ color: 0x5a3a1a });

  for (const cx of [-62, -37, -12, 12, 37, 62]) {
    for (const cz of [-62, -37, -12, 12, 37, 62]) {
      const variants = [
        { dx: -5, dz: -5, w: 6, h: 4, d: 6 },
        { dx: 5, dz: 5, w: 5, h: 3.5, d: 5 },
        { dx: -5, dz: 5, w: 5, h: 3, d: 5 },
        { dx: 5, dz: -5, w: 6, h: 4.5, d: 6 },
      ];
      const used = variants.filter(() => Math.random() < 0.7);

      for (const v of used) {
        const hx = cx + v.dx;
        const hz = cz + v.dz;
        if (Math.abs(hx) > WORLD_HALF - 5 || Math.abs(hz) > WORLD_HALF - 5) continue;

        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(v.w, v.h, v.d), wallMat);
        body.position.y = v.h / 2;
        body.castShadow = !IS_MOBILE; body.receiveShadow = !IS_MOBILE;
        g.add(body);

        const winGeo = new THREE.PlaneGeometry(0.8, 0.8);
        for (const s of [{oz: v.d/2+0.01, rot: 0}, {oz: -v.d/2-0.01, rot: Math.PI}, {ox: v.w/2+0.01, rot: Math.PI/2}, {ox: -v.w/2-0.01, rot: -Math.PI/2}]) {
          for (let i = 0; i < 2; i++) {
            const w = new THREE.Mesh(winGeo, winMat);
            if (s.ox !== undefined) w.position.set(s.ox, v.h * 0.65, (i - 0.5) * v.d * 0.5);
            else w.position.set((i - 0.5) * v.w * 0.5, v.h * 0.65, s.oz);
            w.rotation.y = s.rot;
            g.add(w);
          }
        }

        const door = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.6), doorMat);
        door.position.set(0, 0.8, v.d/2 + 0.01);
        g.add(door);

        const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(v.w, v.d) * 0.85, 1.8, 4), roofMat);
        roof.position.y = v.h + 0.9; roof.rotation.y = Math.PI / 4;
        roof.castShadow = !IS_MOBILE;
        g.add(roof);

        g.position.set(hx, 0, hz);
        scene.add(g);
        obstacles.push({ x: hx, z: hz, w: v.w + 0.8, d: v.d + 0.8 });
      }
    }
  }
}

// ============================================
//   ЗАПРАВКА
// ============================================
function createGasStation() {
  const station = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.BoxGeometry(16, 0.1, 14), new THREE.MeshLambertMaterial({ color: 0xaaaaaa }));
  floor.position.y = 0.05; floor.receiveShadow = !IS_MOBILE;
  station.add(floor);

  const canopyTop = new THREE.Mesh(new THREE.BoxGeometry(14, 0.4, 10), new THREE.MeshLambertMaterial({ color: 0xdddddd }));
  canopyTop.position.set(0, 4.5, 0); canopyTop.castShadow = !IS_MOBILE;
  station.add(canopyTop);

  const stripe = new THREE.Mesh(new THREE.BoxGeometry(14.1, 0.5, 10.1), new THREE.MeshLambertMaterial({ color: 0xe63946 }));
  stripe.position.set(0, 4.05, 0);
  station.add(stripe);

  const pillarMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
  const pillarGeo = new THREE.CylinderGeometry(0.2, 0.2, 4.5, 12);
  for (const [px, pz] of [[-6.5, -4.5], [6.5, -4.5], [-6.5, 4.5], [6.5, 4.5]]) {
    const p = new THREE.Mesh(pillarGeo, pillarMat);
    p.position.set(px, 2.25, pz);
    p.castShadow = !IS_MOBILE;
    station.add(p);
  }

  for (const pz of [-3, 3]) {
    const pump = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.6), new THREE.MeshLambertMaterial({ color: 0x333333 }));
    body.position.y = 0.8; body.castShadow = !IS_MOBILE;
    pump.add(body);
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.4), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
    screen.position.set(0, 1.2, 0.31);
    pump.add(screen);
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 0.7), new THREE.MeshLambertMaterial({ color: 0xe63946 }));
    top.position.y = 1.7;
    pump.add(top);
    pump.position.set(0, 0, pz);
    station.add(pump);
  }

  const signTex = makeTex(256, 128, (g, w, h) => {
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#e63946'); grad.addColorStop(1, '#a4161a');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    g.fillStyle = '#fff'; g.font = 'bold 60px Arial';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('ГАЗ', w/2, h/2 - 10);
    g.font = 'bold 30px Arial';
    g.fillText('⛽', w/2, h/2 + 35);
  });
  const signFace = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.5), new THREE.MeshBasicMaterial({ map: signTex }));
  signFace.position.set(0, 6.8, -5.16);
  signFace.rotation.y = Math.PI;
  station.add(signFace);

  const signBase = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 0.3), new THREE.MeshLambertMaterial({ color: 0xe63946 }));
  signBase.position.set(0, 6, -5);
  station.add(signBase);

  const shop = new THREE.Group();
  const shopBody = new THREE.Mesh(new THREE.BoxGeometry(7, 2.8, 4), new THREE.MeshLambertMaterial({ map: brickTex }));
  shopBody.position.y = 1.4; shopBody.castShadow = !IS_MOBILE; shopBody.receiveShadow = !IS_MOBILE;
  shop.add(shopBody);
  const shopWin = new THREE.Mesh(new THREE.PlaneGeometry(5, 1.5), new THREE.MeshLambertMaterial({ 
    color: 0x9ad0ff, emissive: 0x3a6080, emissiveIntensity: 0.4 
  }));
  shopWin.position.set(0, 1.5, 2.01);
  shop.add(shopWin);
  const shopRoof = new THREE.Mesh(new THREE.BoxGeometry(7.3, 0.3, 4.3), new THREE.MeshLambertMaterial({ color: 0x8b2f2f }));

function createParkedCars() {
  const colors = [0x457b9d, 0x2a9d8f, 0xf77f00, 0x7209b7, 0x8d99ae, 0xe07a5f, 0xffd166, 0x06d6a0, 0x118ab2, 0xef476f];
  const spots = [];
  const roadZs = [-50, -25, 0, 25, 50];
  const roadXs = [-50, -25, 0, 25, 50];
  const parkOffset = 6.5;

  for (const z of roadZs) {
    for (let x = -WORLD_HALF + 8; x <= WORLD_HALF - 8; x += 4.5) {
      let skip = false;
      for (const rx of roadXs) if (Math.abs(x - rx) < 7) skip = true;
      if (skip) continue;
      if (Math.random() < 0.5) spots.push({ x, z: z - parkOffset, angle: 0 });
    }
  }
  for (const x of roadXs) {
    for (let z = -WORLD_HALF + 8; z <= WORLD_HALF - 8; z += 4.5) {
      let skip = false;
      for (const rz of roadZs) if (Math.abs(z - rz) < 7) skip = true;
      if (skip) continue;
      if (Math.random() < 0.5) spots.push({ x: x + parkOffset, z, angle: Math.PI / 2 });
    }
  }

  for (let i = 0; i < spots.length; i++) {
    createParkedCar(spots[i].x, spots[i].z, spots[i].angle, colors[i % colors.length]);
  }
}

function createParkedCar(x, z, angle, color) {
  const g = new THREE.Group();
  const dark = shadeColor(color, -60);
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.55, 3.4), new THREE.MeshLambertMaterial({ color }));
  body.position.y = 0.55; body.castShadow = !IS_MOBILE;
  g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.6), new THREE.MeshLambertMaterial({ color: dark }));
  cabin.position.set(0, 1.05, -0.1); cabin.castShadow = !IS_MOBILE;
  g.add(cabin);
  const glassMat = new THREE.MeshLambertMaterial({ color: 0x9ad0ff, transparent: true, opacity: 0.7 });
  const wf = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.4, 0.05), glassMat);
  wf.position.set(0, 1.05, 0.7); g.add(wf);
  const wb = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.4, 0.05), glassMat);
  wb.position.set(0, 1.05, -0.9); g.add(wb);
  const wGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.28, 16);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  for (const [wx, wz] of [[-0.85, 1.1], [0.85, 1.1], [-0.85, -1.1], [0.85, -1.1]]) {
    const w = new THREE.Mesh(wGeo, wMat);
    w.rotation.z = Math.PI / 2; w.position.set(wx, 0.38, wz);
    w.castShadow = !IS_MOBILE;
    g.add(w);
  }
  g.position.set(x, 0, z);
  g.rotation.y = angle;
  scene.add(g);
  obstacles.push({ x, z, w: 2, d: 3.6 });
}

function shadeColor(hex, amt) {
  const c = hex.toString(16).padStart(6, '0');
  const r = Math.max(0, Math.min(255, parseInt(c.substr(0,2),16) + amt));
  const g = Math.max(0, Math.min(255, parseInt(c.substr(2,2),16) + amt));
  const b = Math.max(0, Math.min(255, parseInt(c.substr(4,2),16) + amt));
  return (r<<16) | (g<<8) | b;
}

const skidMarks = [];
const MAX_MARKS = 250;
const markGeo = new THREE.PlaneGeometry(0.28, 0.8);

function addSkidMark(x, z, angle) {
  const mark = new THREE.Mesh(markGeo, new THREE.MeshBasicMaterial({ 
    color: 0x111111, transparent: true, opacity: 0.55, depthWrite: false 
  }));
  mark.rotation.x = -Math.PI / 2;
  mark.rotation.z = -angle;
  mark.position.set(x, 0.03, z);
  scene.add(mark);
  skidMarks.push({ mesh: mark, life: 400 });
  if (skidMarks.length > MAX_MARKS) {
    const old = skidMarks.shift();
    scene.remove(old.mesh);
  }
}

function checkCollision(newX, newZ) {
  const r = car.radius;
  for (const o of obstacles) {
    const closestX = Math.max(o.x - o.w/2, Math.min(newX, o.x + o.w/2));
    const closestZ = Math.max(o.z - o.d/2, Math.min(newZ, o.z + o.d/2));
    const dx = newX - closestX;
    const dz = newZ - closestZ;
    if (dx*dx + dz*dz < r*r) return o;
  }
  return null;
}

// ============================================
//   ЗВУК
// ============================================
let audioCtx = null, engineOsc = null, engineOsc2 = null, engineGain = null, engineLFO = null;
let tireNoise = null, tireGain = null, soundStarted = false;

function initAudio() {
  if (soundStarted) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundStarted = true;
    startEngineSound();
    startTireSound();
  } catch(e) {}
}

function startEngineSound() {
  if (!audioCtx) return;
  // Основной тон
  engineOsc = audioCtx.createOscillator();
  engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 60;
  
  // Второй тон (гармоника) для реалистичности
  engineOsc2 = audioCtx.createOscillator();
  engineOsc2.type = 'square'; engineOsc2.frequency.value = 90;
  const gain2 = audioCtx.createGain();
  gain2.gain.value = 0.3;
  
  engineLFO = audioCtx.createOscillator();
  engineLFO.type = 'sine'; engineLFO.frequency.value = 8;
  const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 6;
  engineLFO.connect(lfoGain); lfoGain.connect(engineOsc.frequency);
  engineLFO.connect(lfoGain); lfoGain.connect(engineOsc2.frequency);
  
  engineGain = audioCtx.createGain(); engineGain.gain.value = 0;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 900;
  filter.Q.value = 2;
  
  engineOsc.connect(filter);
  engineOsc2.connect(gain2);
  gain2.connect(filter);
  filter.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  
  engineOsc.start();
  engineOsc2.start();
  engineLFO.start();
}

function startTireSound() {
  if (!audioCtx) return;
  const bufferSize = 2 * audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
  tireNoise = audioCtx.createBufferSource();
  tireNoise.buffer = buffer; tireNoise.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass'; filter.frequency.value = 2000;
  tireGain = audioCtx.createGain(); tireGain.gain.value = 0;
  tireNoise.connect(filter); filter.connect(tireGain);
  tireGain.connect(audioCtx.destination);
  tireNoise.start();
}

function updateEngineSound() {
  if (!audioCtx || !engineOsc || !settings.sound) return;
  const speedAbs = Math.abs(car.speed);
  const freq = 55 + (speedAbs / car.maxSpeed) * 130;
  engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.08);
  engineOsc2.frequency.setTargetAtTime(freq * 1.5, audioCtx.currentTime, 0.08);
  const vol = Math.min(0.09, (speedAbs / car.maxSpeed) * 0.1 + 0.01);
  engineGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.1);
}

function updateTireSound(isDrifting) {
  if (!audioCtx || !tireGain || !settings.sound) return;
  tireGain.gain.setTargetAtTime(isDrifting ? 0.07 : 0, audioCtx.currentTime, 0.15);
}

function honk() {
  if (!audioCtx || !settings.sound) return;
  // Двухтональный гудок
  const osc1 = audioCtx.createOscillator();
  osc1.type = 'square'; osc1.frequency.value = 380;
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'square'; osc2.frequency.value = 480;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.1, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc1.connect(g); osc2.connect(g); g.connect(audioCtx.destination);
  osc1.start(); osc2.start();
  osc1.stop(audioCtx.currentTime + 0.4);
  osc2.stop(audioCtx.currentTime + 0.4);
}

// ============================================
//   ДВИЖЕНИЕ — новая плавная физика
// ============================================
function updateCar(dt) {
  let throttle = 0, steer = 0, steerInput = 0;

  if (keys['w'] || keys['arrowup'] || keys['ц']) throttle += 1;
  if (keys['s'] || keys['arrowdown'] || keys['ы']) throttle -= 1;
  if (keys['a'] || keys['arrowleft'] || keys['ф']) steer += 1;
  if (keys['d'] || keys['arrowright'] || keys['в']) steer -= 1;
  if (keys[' ']) car.handbrake = true;
  else if (!btnHandbrake.pressed) car.handbrake = false;

  if (btnGas.pressed) throttle = 1;
  if (btnReverse.pressed) throttle = -1;
  if (btnSteerLeft.pressed) steer = 1;
  if (btnSteerRight.pressed) steer = -1;
  if (btnHandbrake.pressed) car.handbrake = true;

  steerInput = steer;
  const speedAbs = Math.abs(car.speed);

  // === УСКОРЕНИЕ / ТОРМОЖЕНИЕ / ТРЕНИЕ ===
  if (car.handbrake) {
    // Ручник — резкое торможение
    car.speed *= Math.pow(0.85, dt * 60);
    if (Math.abs(car.speed) < 0.05) car.speed = 0;
  } else {
    if (throttle > 0) {
      // Плавное ускорение с ослаблением на высокой скорости
      const accelFactor = 1 - Math.pow(speedAbs / car.maxSpeed, 1.5) * 0.7;
      car.speed += car.accel * dt * throttle * Math.max(0.3, accelFactor);
      if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
    } else if (throttle < 0) {
      if (car.speed > 0.5) {
        // Торможение
        car.speed -= car.brake * dt;
        if (car.speed < 0) car.speed = 0;
      } else {
        // Задний ход
        const reverseAccel = car.accel * 0.5 * dt * throttle;
        car.speed += reverseAccel;
        if (car.speed < car.maxReverse) car.speed = car.maxReverse;
      }
    } else {
      // Трение (мягкое)
      const frictionForce = car.friction * (1 + speedAbs * 0.02) * dt;
      if (car.speed > 0) {
        car.speed -= frictionForce;
        if (car.speed < 0) car.speed = 0;
      } else if (car.speed < 0) {
        car.speed += frictionForce;
        if (car.speed > 0) car.speed = 0;
      }
    }
  }

  // === ПОВОРОТ РУЛЯ ===
  // Плавно поворачиваем колесо к целевому углу
  const targetWheelAngle = -steerInput * 0.55;
  car.wheelAngle += (targetWheelAngle - car.wheelAngle) * Math.min(1, dt * 12);

  // Поворот машины — зависит от скорости и угла руля
  const isDrifting = speedAbs > 10 && Math.abs(steerInput) > 0.5;
  
  if (speedAbs > 0.5) {
    // Плавное вращение с эффектом замедления на низкой скорости
    const steerStrength = car.wheelAngle;
    const speedFactor = Math.min(1, speedAbs / 5);
    const reverseFactor = car.speed > 0 ? 1 : -1;
    const targetAngularVelocity = steerStrength * car.turnSpeed * settings.sensitivity * speedFactor * reverseFactor;
    car.angularVelocity += (targetAngularVelocity - car.angularVelocity) * Math.min(1, dt * 8);
    
    // Боковое скольжение при дрифте
    if (isDrifting) {
      car.lateralVelocity = steerStrength * speedAbs * 0.15 * (1 - Math.abs(car.angularVelocity) / 3);
    } else {
      car.lateralVelocity *= 0.9;
    }
  } else {
    car.angularVelocity *= 0.85;
    car.lateralVelocity *= 0.9;
  }

  car.angle += car.angularVelocity * dt;

  // === ДВИЖЕНИЕ ===
  const forwardX = Math.sin(car.angle) * car.speed;
  const forwardZ = Math.cos(car.angle) * car.speed;
  const lateralX = Math.cos(car.angle) * car.lateralVelocity;
  const lateralZ = -Math.sin(car.angle) * car.lateralVelocity;

  const oldX = car.x, oldZ = car.z;
  const nextX = car.x + (forwardX + lateralX) * dt;
  const nextZ = car.z + (forwardZ + lateralZ) * dt;

  const col = checkCollision(nextX, nextZ);
  if (col) {
    car.speed *= -0.3;
    car.lateralVelocity *= -0.3;
    car.angularVelocity *= 0.3;
    shakeAmount = 8;
    crashSound();
    const dx = car.x - col.x;
    const dz = car.z - col.z;
    const len = Math.hypot(dx, dz) || 1;
    car.x += (dx / len) * 0.3;
    car.z += (dz / len) * 0.3;
  } else {
    car.x = nextX;
    car.z = nextZ;
  }

  car.x = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, car.x));
  car.z = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, car.z));

  distanceDriven += Math.hypot(car.x - oldX, car.z - oldZ);
  if (speedAbs > maxSpeedReached) maxSpeedReached = speedAbs;

  // === ПРИМЕНЯЕМ К 3D ОБЪЕКТУ ===
  carGroup.position.set(car.x, 0, car.z);
  carGroup.rotation.y = car.angle;

  // Колёса
  for (const w of wheels) {
    w.mesh.rotation.x += car.speed * dt * 4;
    if (w.isFront) {
      w.pivot.rotation.y = car.wheelAngle;
    }
  }

  // Наклон кузова
  const targetTilt = -car.angularVelocity * 0.08;
  carGroup.rotation.z += (targetTilt - carGroup.rotation.z) * Math.min(1, dt * 6);

  // === СЛЕДЫ ШИН ===
  if ((isDrifting || (car.handbrake && speedAbs > 3)) && Math.random() < 0.7) {
    const backX = car.x - Math.sin(car.angle) * 1.3;
    const backZ = car.z - Math.cos(car.angle) * 1.3;
    const sideX = Math.cos(car.angle) * 0.95;
    const sideZ = -Math.sin(car.angle) * 0.95;
    addSkidMark(backX + sideX, backZ + sideZ, car.angle);
    addSkidMark(backX - sideX, backZ - sideZ, car.angle);
  }

  // === МОНЕТКИ ===
  for (const p of pickupItems) {
    if (!p.alive) continue;
    const d = Math.hypot(p.x - car.x, p.z - car.z);
    if (d < car.radius + 0.7) {
      p.alive = false;
      coinSound();
      shakeAmount = 2;
      // Анимация исчезновения (просто скрываем)
      p.mesh.visible = false;
    }
  }

  // === СЛЕДЫ ЗАТУХАЮТ ===
  for (let i = skidMarks.length - 1; i >= 0; i--) {
    skidMarks[i].life -= 1;
    skidMarks[i].mesh.material.opacity = Math.max(0, skidMarks[i].life / 400) * 0.55;
    if (skidMarks[i].life <= 0) {
      scene.remove(skidMarks[i].mesh);
      skidMarks.splice(i, 1);
    }
  }

  // === МОНЕТКИ ВРАЩАЮТСЯ И ПАРЯТ ===
  const time = performance.now() / 1000;
  for (const p of pickupItems) {
    if (p.alive) {
      p.spin += dt * 3;
      p.mesh.rotation.z = p.spin;
      p.mesh.position.y = p.baseY + Math.sin(time * 2 + p.x) * 0.15;
    }
  }

  updateEngineSound();
  updateTireSound(isDrifting || (car.handbrake && speedAbs > 3));

  if (shakeAmount > 0) shakeAmount *= Math.pow(0.88, dt * 60);
  if (shakeAmount < 0.3) shakeAmount = 0;

  const speedEl = document.getElementById('speed');
  if (speedEl) speedEl.innerHTML = Math.round(speedAbs * 3.6) + '<small>км/ч</small>';
}

let camPos = { x: 0, y: 6, z: -10 };
let camLook = { x: 0, y: 1.2, z: 0 };

function updateCamera(dt) {
  const camOffset = { x: 0, y: 6, z: -10 };
  const cos = Math.cos(car.angle), sin = Math.sin(car.angle);
  
  // Целевая позиция с учётом тряски
  const shakeX = (Math.random() - 0.5) * shakeAmount * 0.15;
  const shakeY = (Math.random() - 0.5) * shakeAmount * 0.15;
  
  const tx = car.x + camOffset.x * cos + camOffset.z * sin + shakeX;
  const ty = camOffset.y + shakeY;
  const tz = car.z - camOffset.x * sin + camOffset.z * cos;

  // Плавное следование с учётом скорости (быстрее едешь — быстрее камера)
  const lerpSpeed = 0.08 + Math.min(0.1, Math.abs(car.speed) / 200);
  camPos.x += (tx - camPos.x) * lerpSpeed;
  camPos.y += (ty - camPos.y) * lerpSpeed;
  camPos.z += (tz - camPos.z) * lerpSpeed;

  camera.position.set(camPos.x, camPos.y, camPos.z);

  // Плавный look-at
  const lookAhead = 4 + Math.abs(car.speed) * 0.15;
  const lookX = car.x + Math.sin(car.angle) * lookAhead;
  const lookZ = car.z + Math.cos(car.angle) * lookAhead;
  camLook.x += (lookX - camLook.x) * 0.15;
  camLook.z += (lookZ - camLook.z) * 0.15;
  camLook.y = 1.2;
  
  camera.lookAt(camLook.x, camLook.y, camLook.z);
}// ============================================

function drawButtons() {
  for (const b of allButtons) {
    if (!b.visible) continue;
    const isHover = menuHover === b;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, b.x - b.w/2 + 4, b.y - b.h/2 + 4, b.w, b.h, 12);
    ctx.fill();
    const grad = ctx.createLinearGradient(0, b.y - b.h/2, 0, b.y + b.h/2);
    if (isHover) { grad.addColorStop(0, lighten(b.color, 40)); grad.addColorStop(1, b.color); }
    else { grad.addColorStop(0, b.color); grad.addColorStop(1, darken(b.color, 30)); }
    ctx.fillStyle = grad;
    roundRect(ctx, b.x - b.w/2, b.y - b.h/2, b.w, b.h, 12);
    ctx.fill();
    ctx.strokeStyle = isHover ? '#fff' : 'rgba(0,0,0,0.6)';
    ctx.lineWidth = isHover ? 3 : 2;
    roundRect(ctx, b.x - b.w/2, b.y - b.h/2, b.w, b.h, 12);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.text, b.x, b.y + 2);
  }
}

function lighten(hex, amt) {
  const c = hex.replace('#','');
  const r = Math.min(255, parseInt(c.substr(0,2),16) + amt);
  const g = Math.min(255, parseInt(c.substr(2,2),16) + amt);
  const b = Math.min(255, parseInt(c.substr(4,2),16) + amt);
  return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}
function darken(hex, amt) {
  const c = hex.replace('#','');
  const r = Math.max(0, parseInt(c.substr(0,2),16) - amt);
  const g = Math.max(0, parseInt(c.substr(2,2),16) - amt);
  const b = Math.max(0, parseInt(c.substr(4,2),16) - amt);
  return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

function layoutPause() {
  clearButtons();
  const w = uiCanvas.width, h = uiCanvas.height;
  const bw = Math.min(300, w * 0.5);
  const bh = 55;
  const cx = w / 2;
  const startY = h * 0.35;

  makeButton('resume', '▶  ПРОДОЛЖИТЬ', cx, startY, bw, bh, '#06d6a0', () => {
    clickSound(); state = 'playing';
    if (audioCtx) audioCtx.resume();
  });
  makeButton('restart', '🔄  ЗАНОВО', cx, startY + bh + 12, bw, bh, '#f77f00', () => { clickSound(); startGame(); });
  makeButton('menu', '🏠  В МЕНЮ', cx, startY + (bh + 12) * 2, bw, bh, '#457b9d', () => { clickSound(); state = 'menu'; layoutMenu(); });
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, uiCanvas.width, uiCanvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.min(60, uiCanvas.width*0.12) + 'px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⏸ ПАУЗА', uiCanvas.width/2, uiCanvas.height * 0.2);
  drawButtons();
}

let uiCanvas, uiCtx, ctx;

function initUI() {
  uiCanvas = document.createElement('canvas');
  Object.assign(uiCanvas.style, { position: 'fixed', inset: '0', pointerEvents: 'auto', touchAction: 'none', zIndex: 10 });
  uiCanvas.width = innerWidth;
  uiCanvas.height = innerHeight;
  document.body.appendChild(uiCanvas);
  uiCtx = uiCanvas.getContext('2d');
  ctx = uiCtx;

  uiCanvas.addEventListener('mousemove', e => {
    const r = uiCanvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    menuHover = getBtnAt(mouse.x, mouse.y);
  });
  uiCanvas.addEventListener('mousedown', e => {
    initAudio();
    const r = uiCanvas.getBoundingClientRect();
    const mx = e.clientX - r.left;
    const my = e.clientY - r.top;
    const b = getBtnAt(mx, my);
    if (b) b.onClick();
    if (state === 'playing') {
      if (Math.hypot(mx - honkBtn.x, my - honkBtn.y) < honkBtn.r) { honk(); honkBtn.active = true; }
      if (Math.hypot(mx - btnGas.x, my - btnGas.y) < btnGas.r) btnGas.pressed = true;
      if (Math.hypot(mx - btnReverse.x, my - btnReverse.y) < btnReverse.r) btnReverse.pressed = true;
      if (Math.hypot(mx - btnSteerLeft.x, my - btnSteerLeft.y) < btnSteerLeft.r) btnSteerLeft.pressed = true;
      if (Math.hypot(mx - btnSteerRight.x, my - btnSteerRight.y) < btnSteerRight.r) btnSteerRight.pressed = true;
      if (Math.hypot(mx - btnHandbrake.x, my - btnHandbrake.y) < btnHandbrake.r) btnHandbrake.pressed = true;
    }
  });
  uiCanvas.addEventListener('mouseup', () => {
    honkBtn.active = false;
    btnGas.pressed = false; btnReverse.pressed = false;
    btnSteerLeft.pressed = false; btnSteerRight.pressed = false;
    btnHandbrake.pressed = false;
  });

  uiCanvas.addEventListener('touchstart', onTouchStart, { passive: false });
  uiCanvas.addEventListener('touchmove', onTouchMove, { passive: false });
  uiCanvas.addEventListener('touchend', onTouchEnd, { passive: false });
  uiCanvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

  updateBtnPositions();
  addEventListener('resize', () => {
    uiCanvas.width = innerWidth;
    uiCanvas.height = innerHeight;
    updateBtnPositions();
    if (state === 'menu') layoutMenu();
    else if (state === 'settings') layoutSettings();
    else if (state === 'controls') layoutControls();
    else if (state === 'records') layoutRecords();
    else if (state === 'paused') layoutPause();
  });
}

const honkBtn = { x: 0, y: 0, r: 28, active: false };
const pauseBtn = { x: 0, y: 0, r: 26, active: false };
const btnGas = { x: 0, y: 0, r: 52, pressed: false, id: null };
const btnReverse = { x: 0, y: 0, r: 42, pressed: false, id: null };
const btnSteerLeft = { x: 0, y: 0, r: 52, pressed: false, id: null };
const btnSteerRight = { x: 0, y: 0, r: 52, pressed: false, id: null };
const btnHandbrake = { x: 0, y: 0, r: 34, pressed: false, id: null };

function updateBtnPositions() {
  const w = innerWidth, h = innerHeight;
  honkBtn.x = w - 40; honkBtn.y = 40;
  pauseBtn.x = 40; pauseBtn.y = 40;
  btnSteerLeft.x = 90; btnSteerLeft.y = h - 110;
  btnSteerRight.x = 90 + 130; btnSteerRight.y = h - 110;
  btnGas.x = w - 100; btnGas.y = h - 220;
  btnReverse.x = w - 100; btnReverse.y = h - 110;
  btnHandbrake.x = w - 200; btnHandbrake.y = h - 110;
}

function onTouchStart(e) {
  initAudio();
  for (const t of e.changedTouches) {
    const mx = t.clientX, my = t.clientY;

    if (state !== 'playing') {
      const b = getBtnAt(mx, my);
      if (b) { b.onClick(); e.preventDefault(); continue; }
    }

    if (state === 'playing') {
      if (Math.hypot(mx - honkBtn.x, my - honkBtn.y) < honkBtn.r + 10) {
        honk(); honkBtn.active = true;
        e.preventDefault(); continue;
      }
      if (Math.hypot(mx - pauseBtn.x, my - pauseBtn.y) < pauseBtn.r + 10) {
        state = 'paused'; layoutPause();
        e.preventDefault(); continue;
      }
      if (Math.hypot(mx - btnGas.x, my - btnGas.y) < btnGas.r + 10) {
        btnGas.pressed = true; btnGas.id = t.identifier;
        e.preventDefault(); continue;
      }
      if (Math.hypot(mx - btnReverse.x, my - btnReverse.y) < btnReverse.r + 10) {
        btnReverse.pressed = true; btnReverse.id = t.identifier;
        e.preventDefault(); continue;
      }
      if (Math.hypot(mx - btnSteerLeft.x, my - btnSteerLeft.y) < btnSteerLeft.r + 10) {
        btnSteerLeft.pressed = true; btnSteerLeft.id = t.identifier;
        e.preventDefault(); continue;
      }
      if (Math.hypot(mx - btnSteerRight.x, my - btnSteerRight.y) < btnSteerRight.r + 10) {
        btnSteerRight.pressed = true; btnSteerRight.id = t.identifier;
        e.preventDefault(); continue;
      }
      if (Math.hypot(mx - btnHandbrake.x, my - btnHandbrake.y) < btnHandbrake.r + 10) {
        btnHandbrake.pressed = true; btnHandbrake.id = t.identifier;
        e.preventDefault(); continue;
      }
    }
  }
}

function onTouchMove(e) {}
function onTouchEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === btnGas.id) { btnGas.pressed = false; btnGas.id = null; }
    if (t.identifier === btnReverse.id) { btnReverse.pressed = false; btnReverse.id = null; }
    if (t.identifier === btnSteerLeft.id) { btnSteerLeft.pressed = false; btnSteerLeft.id = null; }
    if (t.identifier === btnSteerRight.id) { btnSteerRight.pressed = false; btnSteerRight.id = null; }
    if (t.identifier === btnHandbrake.id) { btnHandbrake.pressed = false; btnHandbrake.id = null; }
  }
  honkBtn.active = false;
}

function drawBtn(btn, symbol, color, label) {
  uiCtx.globalAlpha = btn.pressed ? 1 : 0.75;
  uiCtx.fillStyle = color;
  uiCtx.beginPath(); uiCtx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2); uiCtx.fill();
  uiCtx.strokeStyle = '#fff'; uiCtx.lineWidth = 4;
  uiCtx.beginPath(); uiCtx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2); uiCtx.stroke();
  uiCtx.globalAlpha = 1;
  uiCtx.fillStyle = '#fff';
  uiCtx.font = 'bold ' + Math.round(btn.r * 0.9) + 'px Arial';
  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';
  uiCtx.fillText(symbol, btn.x, btn.y + 2);
  if (label) {
    uiCtx.fillStyle = 'rgba(255,255,255,0.9)';
    uiCtx.font = 'bold 13px Arial';
    uiCtx.textBaseline = 'top';
    uiCtx.fillText(label, btn.x, btn.y + btn.r + 6);
  }
}

function drawGameUI() {
  uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
  if (state !== 'playing' && state !== 'paused') return;

  drawBtn(btnSteerLeft, '◀', '#2a9d8f', 'ВЛЕВО');
  drawBtn(btnSteerRight, '▶', '#2a9d8f', 'ВПРАВО');
  drawBtn(btnGas, '▲', '#06d6a0', 'ГАЗ');
  drawBtn(btnReverse, '▼', '#e63946', 'НАЗАД');
  drawBtn(btnHandbrake, 'P', '#f77f00', 'РУЧНИК');

  uiCtx.globalAlpha = honkBtn.active ? 1 : 0.7;
  uiCtx.fillStyle = honkBtn.active ? '#ffcc00' : '#000';
  uiCtx.beginPath(); uiCtx.arc(honkBtn.x, honkBtn.y, honkBtn.r, 0, Math.PI*2); uiCtx.fill();
  uiCtx.strokeStyle = '#fff'; uiCtx.lineWidth = 3;
  uiCtx.beginPath(); uiCtx.arc(honkBtn.x, honkBtn.y, honkBtn.r, 0, Math.PI*2); uiCtx.stroke();
  uiCtx.globalAlpha = 1;
  uiCtx.fillStyle = honkBtn.active ? '#000' : '#fff';
  uiCtx.font = 'bold 22px Arial';
  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';
  uiCtx.fillText('📣', honkBtn.x, honkBtn.y + 1);

  uiCtx.globalAlpha = 0.7;
  uiCtx.fillStyle = '#000';
  uiCtx.beginPath(); uiCtx.arc(pauseBtn.x, pauseBtn.y, pauseBtn.r, 0, Math.PI*2); uiCtx.fill();
  uiCtx.strokeStyle = '#fff'; uiCtx.lineWidth = 3;
  uiCtx.beginPath(); uiCtx.arc(pauseBtn.x, pauseBtn.y, pauseBtn.r, 0, Math.PI*2); uiCtx.stroke();
  uiCtx.globalAlpha = 1;
  uiCtx.fillStyle = '#fff';
  uiCtx.fillRect(pauseBtn.x - 6, pauseBtn.y - 8, 4, 16);
  uiCtx.fillRect(pauseBtn.x + 2, pauseBtn.y - 8, 4, 16);

  const coinsCollected = pickupItems.filter(p => !p.alive).length;
  uiCtx.fillStyle = 'rgba(0,0,0,0.65)';
  roundRect(uiCtx, uiCanvas.width/2 - 70, 15, 140, 40, 10);
  uiCtx.fill();
  uiCtx.strokeStyle = 'rgba(255,204,0,0.6)'; uiCtx.lineWidth = 2;
  roundRect(uiCtx, uiCanvas.width/2 - 70, 15, 140, 40, 10);
  uiCtx.stroke();
  uiCtx.fillStyle = '#fff';
  uiCtx.font = 'bold 22px Arial';
  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';
  uiCtx.fillText('🪙 ' + coinsCollected + '/' + pickupItems.length, uiCanvas.width/2, 35);
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function startGame() {
  resetCar();
  gameTime = 0;
  maxSpeedReached = 0;
  distanceDriven = 0;
  camPos = { x: car.x, y: 6, z: car.z - 10 };
  camLook = { x: car.x, y: 1.2, z: car.z };
  state = 'playing';
  const sp = document.getElementById('speed');
  if (sp) sp.style.display = 'block';
}

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state === 'playing') {
    updateCar(dt);
    updateCamera(dt);
    gameTime += dt;
  } else if (state === 'paused') {
    // стоит
  } else {
    if (camera && carGroup) {
      const t = now / 3000;
      camera.position.x = Math.sin(t) * 40;
      camera.position.z = Math.cos(t) * 40;
      camera.position.y = 18;
      camera.lookAt(0, 1, 0);
    }
  }

  renderer.render(scene, camera);

  if (state === 'splash') drawSplash();
  else if (state === 'menu') { menuHover = getBtnAt(mouse.x, mouse.y); drawMenu(); }
  else if (state === 'settings') { menuHover = getBtnAt(mouse.x, mouse.y); drawSettings(); }
  else if (state === 'controls') { menuHover = getBtnAt(mouse.x, mouse.y); drawControls(); }
  else if (state === 'records') { menuHover = getBtnAt(mouse.x, mouse.y); drawRecords(); }
  else if (state === 'playing') drawGameUI();
  else if (state === 'paused') { drawGameUI(); drawPause(); }
}

function onResize() {
  if (camera) {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
}

init3D();
initUI();
splashStart = performance.now();

addEventListener('keydown', e => {
  initAudio();
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Escape') {
    if (state === 'playing') { state = 'paused'; layoutPause(); }
    else if (state === 'paused') { state = 'playing'; }
  }
  if (e.key === ' ' && state === 'playing') honk();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

animate();
</script>
</body>
</html>
