<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>3D Город</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #speed { position: fixed; bottom: 12px; left: 12px; color: #ffcc00; font-size: 26px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px 16px; border-radius: 10px; font-family: monospace; z-index: 5; display: none; }
  #speed small { font-size: 11px; color: #aaa; display: block; text-align: right; }
</style>
</head>
<body>
<div id="speed">0<small>км/ч</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const IS_MOBILE = IS_TOUCH && Math.min(innerWidth, innerHeight) < 900;

let scene, camera, renderer;
let carGroup, wheels = [];
let keys = {};
let state = 'splash';
let splashStart = 0;
let gameStartTime = 0;
let gameTime = 0;
let maxSpeedReached = 0;
let distanceDriven = 0;

let records = { topScores: [], bestSpeed: 0, bestTime: 0, bestDistance: 0 };
try { const r = localStorage.getItem('carGameRecords'); if (r) records = Object.assign(records, JSON.parse(r)); } catch(e){}
function saveRecords() { try { localStorage.setItem('carGameRecords', JSON.stringify(records)); } catch(e){} }

let settings = { sound: true, music: true, graphics: 'high', sensitivity: 1.0 };
try { const s = localStorage.getItem('carGameSettings'); if (s) settings = Object.assign(settings, JSON.parse(s)); } catch(e){}
function saveSettings() { try { localStorage.setItem('carGameSettings', JSON.stringify(settings)); } catch(e){} }

function makeTex(w, h, drawFn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  drawFn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}

const grassTex = makeTex(128, 128, (g, w, h) => {
  g.fillStyle = '#4a7c3a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) {
    const s = 60 + Math.random() * 60;
    g.fillStyle = `rgb(${s-20},${s+40},${s-30})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1.5, 3);
  }
});
grassTex.repeat.set(25, 25);

const asphaltTex = makeTex(128, 128, (g, w, h) => {
  g.fillStyle = '#3a3a3a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1000; i++) {
    const s = 30 + Math.random() * 40;
    g.fillStyle = `rgb(${s},${s},${s})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1, 1);
  }
});

const brickTex = makeTex(128, 128, (g, w, h) => {
  g.fillStyle = '#b86b3a'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#7a4020';
  const bh = 16, bw = 32;
  for (let y = 0; y < h; y += bh) {
    const off = (y/bh) % 2 ? bw/2 : 0;
    for (let x = -bw; x < w + bw; x += bw) g.fillRect(x+off, y, bw-2, bh-2);
  }
});

const roofTex = makeTex(64, 64, (g, w, h) => {
  g.fillStyle = '#8b2f2f'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 8) {
    g.fillStyle = x % 16 ? '#7a2525' : '#9a3535';
    g.fillRect(x, 0, 7, h);
  }
});

const woodTex = makeTex(64, 128, (g, w, h) => {
  g.fillStyle = '#5a3a1a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 20; i++) {
    g.strokeStyle = 'rgba(30,15,5,0.4)';
    g.lineWidth = 1;
    g.beginPath();
    const x = Math.random() * w;
    g.moveTo(x, 0);
    g.lineTo(x + (Math.random()-0.5)*6, h);
    g.stroke();
  }
});

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 55, 150);

  camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 500);
  camera.position.set(0, 5.5, -9);

  renderer = new THREE.WebGLRenderer({ antialias: !IS_MOBILE });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, IS_MOBILE ? 1.5 : 2));
  renderer.shadowMap.enabled = !IS_MOBILE && settings.graphics === 'high';
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xfff4d6, 1.0);
  sun.position.set(40, 60, 30);
  sun.castShadow = !IS_MOBILE && settings.graphics === 'high';
  if (sun.castShadow) {
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 160 });
  }
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0x87ceeb, 0x4a7c3a, 0.35));

  const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffcc }));
  sunMesh.position.set(80, 100, 60);
  scene.add(sunMesh);

  for (let i = 0; i < 10; i++) {
    const cloud = new THREE.Group();
    for (let j = 0; j < 4; j++) {
      const puff = new THREE.Mesh(
        new THREE.SphereGeometry(2 + Math.random()*2, 8, 8),
        new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
      );
      puff.position.set(j*2-3 + Math.random()*2, Math.random()*1, Math.random()*2-1);
      cloud.add(puff);
    }
    cloud.position.set(-100 + Math.random()*200, 35 + Math.random()*15, -100 + Math.random()*200);
    scene.add(cloud);
  }

  createGround();
  createRoads();
  createHouses();
  createGasStation();
  createParkedCars();
  createTreesAndBridges();
  createStreetLamps();
  createCar();

  addEventListener('resize', onResize);
  onResize();
}

function createGround() {
  const grassMat = new THREE.MeshLambertMaterial({ map: grassTex });
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), grassMat);
  grass.rotation.x = -Math.PI / 2;
  grass.receiveShadow = !IS_MOBILE;
  scene.add(grass);

  const wallMat = new THREE.MeshLambertMaterial({ color: 0x666666 });
  for (const [x,y,z,w,h,d] of [
    [0, 0.6, -30, 60, 1.2, 0.5], [0, 0.6, 30, 60, 1.2, 0.5],
    [-30, 0.6, 0, 0.5, 1.2, 60], [30, 0.6, 0, 0.5, 1.2, 60],
  ]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
    wall.position.set(x,y,z);
    wall.castShadow = !IS_MOBILE;
    wall.receiveShadow = !IS_MOBILE;
    scene.add(wall);
  }
}

function createRoads() {
  const roadMat = new THREE.MeshLambertMaterial({ map: asphaltTex });

  const roadX = new THREE.Mesh(new THREE.PlaneGeometry(60, 7), roadMat.clone());
  roadX.material.map = asphaltTex.clone();
  roadX.material.map.repeat.set(15, 1.5);
  roadX.rotation.x = -Math.PI / 2; roadX.position.y = 0.01;
  roadX.receiveShadow = !IS_MOBILE;
  scene.add(roadX);

  const roadZ = new THREE.Mesh(new THREE.PlaneGeometry(7, 60), roadMat.clone());
  roadZ.material.map = asphaltTex.clone();
  roadZ.material.map.repeat.set(1.5, 15);
  roadZ.rotation.x = -Math.PI / 2; roadZ.position.y = 0.01;
  roadZ.receiveShadow = !IS_MOBILE;
  scene.add(roadZ);

  const roadGas = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 15), roadMat.clone());
  roadGas.material.map = asphaltTex.clone();
  roadGas.material.map.repeat.set(1, 4);
  roadGas.rotation.x = -Math.PI / 2;
  roadGas.position.set(-15, 0.01, 11);
  roadGas.receiveShadow = !IS_MOBILE;
  scene.add(roadGas);

  const lineMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
  for (let i = -28; i <= 28; i += 4) {
    if (Math.abs(i) < 2) continue;
    const lx = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.2), lineMat);
    lx.rotation.x = -Math.PI / 2; lx.position.set(i, 0.02, 0);
    scene.add(lx);
    const lz = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 2), lineMat);
    lz.rotation.x = -Math.PI / 2; lz.position.set(0, 0.02, i);
    scene.add(lz);
  }

  const curbMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
  for (const z of [-3.5, 3.5]) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(60, 0.15, 0.3), curbMat);
    c.position.set(0, 0.075, z); c.receiveShadow = !IS_MOBILE; scene.add(c);
  }
  for (const x of [-3.5, 3.5]) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 60), curbMat);
    c.position.set(x, 0.075, 0); c.receiveShadow = !IS_MOBILE; scene.add(c);
  }
}

function createHouses() {
  const wallMat = new THREE.MeshLambertMaterial({ map: brickTex });
  const roofMat = new THREE.MeshLambertMaterial({ map: roofTex });
  const winMat = new THREE.MeshBasicMaterial({ color: 0x9ad0ff });
  const doorMat = new THREE.MeshLambertMaterial({ color: 0x5a3a1a });

  const houses = [
    { x: -22, z: -20, w: 5, h: 3.5, d: 5 }, { x: -22, z: -13, w: 4, h: 3, d: 4 },
    { x: -22, z: -5, w: 5, h: 3.5, d: 4 }, { x: -22, z: 20, w: 5, h: 4, d: 5 },
    { x: -22, z: 27, w: 4, h: 3, d: 4 },
    { x: 22, z: -22, w: 6, h: 4, d: 5 }, { x: 22, z: -15, w: 4, h: 3, d: 4 },
    { x: 22, z: -7, w: 5, h: 3.5, d: 4 }, { x: 22, z: 5, w: 5, h: 4, d: 5 },
    { x: 22, z: 22, w: 6, h: 3.5, d: 5 }, { x: 22, z: 28, w: 4, h: 3, d: 4 },
    { x: -15, z: -22, w: 4, h: 3, d: 4 }, { x: -8, z: -22, w: 5, h: 3.5, d: 4 },
    { x: 8, z: -22, w: 4, h: 3, d: 4 }, { x: 15, z: -22, w: 5, h: 4, d: 5 },
    { x: -15, z: 22, w: 5, h: 3.5, d: 4 }, { x: -8, z: 22, w: 4, h: 3, d: 4 },
    { x: 8, z: 22, w: 5, h: 4, d: 5 }, { x: 15, z: 22, w: 4, h: 3, d: 4 },
  ];

  for (const h of houses) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(h.w, h.h, h.d), wallMat);
    body.position.y = h.h / 2;
    body.castShadow = !IS_MOBILE; body.receiveShadow = !IS_MOBILE;
    g.add(body);

    const winGeo = new THREE.PlaneGeometry(0.8, 0.8);
    for (const s of [{oz: h.d/2+0.01, rot: 0}, {oz: -h.d/2-0.01, rot: Math.PI}, {ox: h.w/2+0.01, rot: Math.PI/2}, {ox: -h.w/2-0.01, rot: -Math.PI/2}]) {
      for (let i = 0; i < 2; i++) {
        const w = new THREE.Mesh(winGeo, winMat);
        if (s.ox !== undefined) w.position.set(s.ox, h.h * 0.65, (i - 0.5) * h.d * 0.5);
        else w.position.set((i - 0.5) * h.w * 0.5, h.h * 0.65, s.oz);
        w.rotation.y = s.rot;
        g.add(w);
      }
    }

    const door = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.6), doorMat);
    door.position.set(0, 0.8, h.d/2 + 0.01);
    g.add(door);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(h.w, h.d) * 0.85, 1.8, 4), roofMat);
    roof.position.y = h.h + 0.9; roof.rotation.y = Math.PI / 4;
    roof.castShadow = !IS_MOBILE;
    g.add(roof);

    g.position.set(h.x, 0, h.z);
    scene.add(g);
  }
}

function createGasStation() {
  const station = new THREE.Group();

  const floor = new THREE.Mesh(new THREE.BoxGeometry(12, 0.1, 10), new THREE.MeshLambertMaterial({ color: 0xaaaaaa }));
  floor.position.y = 0.05; floor.receiveShadow = !IS_MOBILE;
  station.add(floor);

  const canopyTop = new THREE.Mesh(new THREE.BoxGeometry(10, 0.4, 6), new THREE.MeshLambertMaterial({ color: 0xdddddd }));
  canopyTop.position.set(0, 4.5, 0); canopyTop.castShadow = !IS_MOBILE;
  station.add(canopyTop);

  const stripe = new THREE.Mesh(new THREE.BoxGeometry(10.1, 0.5, 6.1), new THREE.MeshLambertMaterial({ color: 0xe63946 }));
  stripe.position.set(0, 4.05, 0);
  station.add(stripe);

  const pillarMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
  const pillarGeo = new THREE.CylinderGeometry(0.2, 0.2, 4.5, 8);
  for (const [px, pz] of [[-4.5, -2.5], [4.5, -2.5], [-4.5, 2.5], [4.5, 2.5]]) {
    const p = new THREE.Mesh(pillarGeo, pillarMat);
    p.position.set(px, 2.25, pz);
    p.castShadow = !IS_MOBILE;
    station.add(p);
  }

  for (const pz of [-2, 2]) {
    const pump = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.6), new THREE.MeshLambertMaterial({ color: 0x333333 }));
    body.position.y = 0.8; body.castShadow = !IS_MOBILE;
    pump.add(body);

    const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.4), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
    screen.position.set(0, 1.2, 0.31);
    pump.add(screen);

    const top = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 0.7), new THREE.MeshLambertMaterial({ color: 0xe63946 }));
    top.position.y = 1.7;
    pump.add(top);

    pump.position.set(0, 0, pz);
    station.add(pump);
  }

  const signTex = makeTex(256, 128, (g, w, h) => {
    g.fillStyle = '#e63946'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#fff'; g.font = 'bold 60px Arial';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('ГАЗ', w/2, h/2 - 10);
    g.font = 'bold 30px Arial';
    g.fillText('⛽', w/2, h/2 + 35);
  });
  const signFace = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.5), new THREE.MeshBasicMaterial({ map: signTex }));
  signFace.position.set(0, 6.8, -3.16);
  signFace.rotation.y = Math.PI;
  station.add(signFace);

  const signBase = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 0.3), new THREE.MeshLambertMaterial({ color: 0xe63946 }));
  signBase.position.set(0, 6, -3);
  station.add(signBase);

  const signPole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 6, 8), new THREE.MeshLambertMaterial({ color: 0x888888 }));
  signPole.position.set(0, 3, -3);
  station.add(signPole);

  const shop = new THREE.Group();
  const shopBody = new THREE.Mesh(new THREE.BoxGeometry(5, 2.8, 4), new THREE.MeshLambertMaterial({ map: brickTex }));
  shopBody.position.y = 1.4; shopBody.castShadow = !IS_MOBILE; shopBody.receiveShadow = !IS_MOBILE;
  shop.add(shopBody);

  const shopWin = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 1.5), new THREE.MeshBasicMaterial({ color: 0x9ad0ff }));
  shopWin.position.set(0, 1.5, 2.01);
  shop.add(shopWin);

  const shopRoof = new THREE.Mesh(new THREE.BoxGeometry(5.3, 0.3, 4.3), new THREE.MeshLambertMaterial({ color: 0x8b2f2f }));
  shopRoof.position.y = 2.95; shopRoof.castShadow = !IS_MOBILE;
  shop.add(shopRoof);

  shop.position.set(0, 0, -6);
  station.add(shop);

  station.position.set(-15, 0, 11);
  scene.add(station);
}

function createParkedCars() {
  const colors = [0x457b9d, 0x2a9d8f, 0xf77f00, 0x7209b7, 0x8d99ae, 0xe07a5f, 0xffd166, 0x06d6a0];
  const spots = [
    { x: 14, z: -3.5, angle: Math.PI / 2 }, { x: 16.5, z: -3.5, angle: Math.PI / 2 },
    { x: 19, z: -3.5, angle: Math.PI / 2 }, { x: 21.5, z: -3.5, angle: Math.PI / 2 },
    { x: 14, z: 3.5, angle: -Math.PI / 2 }, { x: 16.5, z: 3.5, angle: -Math.PI / 2 },
    { x: 19, z: 3.5, angle: -Math.PI / 2 }, { x: 21.5, z: 3.5, angle: -Math.PI / 2 },
    { x: 8, z: 15, angle: 0 }, { x: 11, z: 15, angle: 0 },
    { x: -10, z: -15, angle: 0 }, { x: -13, z: -15, angle: 0 },
  ];
  for (let i = 0; i < spots.length; i++) {
    createParkedCar(spots[i].x, spots[i].z, spots[i].angle, colors[i % colors.length]);
  }
}

function createParkedCar(x, z, angle, color) {
  const g = new THREE.Group();
  const dark = shadeColor(color, -50);
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.55, 3.4), new THREE.MeshLambertMaterial({ color }));
  body.position.y = 0.55; body.castShadow = !IS_MOBILE;
  g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.6), new THREE.MeshLambertMaterial({ color: dark }));
  cabin.position.set(0, 1.05, -0.1); cabin.castShadow = !IS_MOBILE;
  g.add(cabin);
  const glassMat = new THREE.MeshLambertMaterial({ color: 0x9ad0ff, transparent: true, opacity: 0.7 });
  const wf = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.4, 0.05), glassMat);
  wf.position.set(0, 1.05, 0.7); g.add(wf);
  const wb = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.4, 0.05), glassMat);
  wb.position.set(0, 1.05, -0.9); g.add(wb);
  const wGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.28, 12);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  for (const [wx, wz] of [[-0.85, 1.1], [0.85, 1.1], [-0.85, -1.1], [0.85, -1.1]]) {
    const w = new THREE.Mesh(wGeo, wMat);
    w.rotation.z = Math.PI / 2; w.position.set(wx, 0.38, wz);
    w.castShadow = !IS_MOBILE;
    g.add(w);
  }
  g.position.set(x, 0, z);
  g.rotation.y = angle;
  scene.add(g);
}

function shadeColor(hex, amt) {
  const c = hex.toString(16).padStart(6, '0');
  const r = Math.max(0, Math.min(255, parseInt(c.substr(0,2),16) + amt));
  const g = Math.max(0, Math.min(255, parseInt(c.substr(2,2),16) + amt));
  const b = Math.max(0, Math.min(255, parseInt(c.substr(4,2),16) + amt));
  return (r<<16) | (g<<8) | b;
}

function createTreesAndBridges() {
  const trunkMat = new THREE.MeshLambertMaterial({ map: woodTex });
  const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2d7a1e });

  for (let x = -28; x <= 28; x += 3.5) {
    for (let z = -28; z <= 28; z += 3.5) {
      if (Math.abs(x) < 6 || Math.abs(z) < 6) continue;
      if (Math.abs(Math.abs(x) - 22) < 3) continue;
      if (Math.abs(Math.abs(z) - 22) < 3) continue;
      if (x < -8 && x > -25 && z > 5 && z < 18) continue;
      if (Math.random() < 0.3) {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.8, 6), trunkMat);
        trunk.position.y = 0.9; trunk.castShadow = !IS_MOBILE;
        tree.add(trunk);
        const l1 = new THREE.Mesh(new THREE.SphereGeometry(1.3, 6, 6), leavesMat);
        l1.position.y = 2.3; l1.castShadow = !IS_MOBILE;
        tree.add(l1);
        const l2 = new THREE.Mesh(new THREE.SphereGeometry(1.0, 6, 6), leavesMat);
        l2.position.set(0.5, 2.9, 0.3); l2.castShadow = !IS_MOBILE;
        tree.add(l2);
        tree.position.set(x + (Math.random()-0.5)*2, 0, z + (Math.random()-0.5)*2);
        tree.rotation.y = Math.random() * Math.PI * 2;
        scene.add(tree);
      }
    }
  }

  const crosswalkMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (let i = -3; i <= 3; i += 1) {
    const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 6.5), crosswalkMat);
    stripe.rotation.x = -Math.PI / 2;
    stripe.position.set(-10 + i * 0.9, 0.021, 0);
    scene.add(stripe);
  }
}

function createStreetLamps() {
  const poleMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
  const lampPos = [
    [4.5, 5], [-4.5, 5], [4.5, -5], [-4.5, -5],
    [4.5, 12], [-4.5, 12], [4.5, -12], [-4.5, -12],
    [4.5, 18], [-4.5, 18], [4.5, -18], [-4.5, -18],
    [12, 4.5], [18, 4.5], [24, 4.5],
    [12, -4.5], [18, -4.5], [24, -4.5],
    [-12, 4.5], [-18, 4.5], [-24, 4.5],
    [-12, -4.5], [-18, -4.5], [-24, -4.5],
  ];
  for (const [x, z] of lampPos) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 3.5, 6), poleMat);
    pole.position.set(x, 1.75, z); pole.castShadow = !IS_MOBILE;
    scene.add(pole);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), lampMat);
    lamp.position.set(x, 3.6, z);
    scene.add(lamp);
  }
}

const skidMarks = [];

const markGeo = new THREE.PlaneGeometry(0.25, 0.7);

function addSkidMark(x, z, angle) {
  const mark = new THREE.Mesh(markGeo, new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.55, depthWrite: false }));
  mark.rotation.x = -Math.PI / 2;

let audioCtx = null, engineOsc = null, engineGain = null, engineLFO = null;
let tireNoise = null, tireGain = null, soundStarted = false;

function initAudio() {
  if (soundStarted) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundStarted = true;
    startEngineSound();
    startTireSound();
  } catch(e) {}
}

function startEngineSound() {
  if (!audioCtx) return;
  engineOsc = audioCtx.createOscillator();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 60;
  engineLFO = audioCtx.createOscillator();
  engineLFO.type = 'sine';
  engineLFO.frequency.value = 8;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 6;
  engineLFO.connect(lfoGain);
  lfoGain.connect(engineOsc.frequency);
  engineGain = audioCtx.createGain();
  engineGain.gain.value = 0;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 800;
  engineOsc.connect(filter);
  filter.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineOsc.start();
  engineLFO.start();
}

function startTireSound() {
  if (!audioCtx) return;
  const bufferSize = 2 * audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
  tireNoise = audioCtx.createBufferSource();
  tireNoise.buffer = buffer;
  tireNoise.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 2000;
  tireGain = audioCtx.createGain();
  tireGain.gain.value = 0;
  tireNoise.connect(filter);
  filter.connect(tireGain);
  tireGain.connect(audioCtx.destination);
  tireNoise.start();
}

function updateEngineSound() {
  if (!audioCtx || !engineOsc || !settings.sound) return;
  const speedAbs = Math.abs(car.speed);
  const freq = 55 + (speedAbs / car.maxSpeed) * 120;
  engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
  const vol = Math.min(0.08, (speedAbs / car.maxSpeed) * 0.09 + 0.01);
  engineGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.08);
}

function updateTireSound(isDrifting) {
  if (!audioCtx || !tireGain || !settings.sound) return;
  tireGain.gain.setTargetAtTime(isDrifting ? 0.06 : 0, audioCtx.currentTime, 0.1);
}

function honk() {
  if (!audioCtx || !settings.sound) return;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.value = 400;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.35);
}

function clickSound() {
  if (!audioCtx || !settings.sound) return;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.value = 600;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.07);
}

function updateCar(dt) {
  let throttle = 0, steer = 0;
  if (keys['w'] || keys['arrowup'] || keys['ц']) throttle += 1;
  if (keys['s'] || keys['arrowdown'] || keys['ы']) throttle -= 1;
  if (keys['a'] || keys['arrowleft'] || keys['ф']) steer += 1;
  if (keys['d'] || keys['arrowright'] || keys['в']) steer -= 1;

  if (joystick.active) {
    throttle = -joystick.dy;
    steer = -joystick.dx;
    if (Math.abs(throttle) < 0.15) throttle = 0;
    if (Math.abs(steer) < 0.15) steer = 0;
  }

  const speedAbs = Math.abs(car.speed);

  if (throttle > 0) {
    car.speed += car.accel * dt * throttle;
    if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
  } else if (throttle < 0) {
    if (car.speed > 0) car.speed -= car.brake * dt;
    else {
      car.speed += car.accel * dt * throttle * 0.5;
      if (car.speed < car.maxReverse) car.speed = car.maxReverse;
    }
  } else {
    if (car.speed > 0) { car.speed -= car.friction * dt; if (car.speed < 0) car.speed = 0; }
    else if (car.speed < 0) { car.speed += car.friction * dt; if (car.speed > 0) car.speed = 0; }
  }

  const isDrifting = speedAbs > 8 && Math.abs(steer) > 0.5;
  if (speedAbs > 0.5) {
    car.angle += car.turnSpeed * dt * steer * settings.sensitivity * (car.speed > 0 ? 1 : -1) * Math.min(1, speedAbs / 6);
  }

  const oldX = car.x, oldZ = car.z;
  car.x += Math.sin(car.angle) * car.speed * dt;
  car.z += Math.cos(car.angle) * car.speed * dt;
  car.x = Math.max(-28.5, Math.min(28.5, car.x));
  car.z = Math.max(-28.5, Math.min(28.5, car.z));

  distanceDriven += Math.hypot(car.x - oldX, car.z - oldZ);
  if (speedAbs > maxSpeedReached) maxSpeedReached = speedAbs;

  carGroup.position.set(car.x, 0, car.z);
  carGroup.rotation.y = car.angle;

  for (const w of wheels) {
    w.rotation.x += car.speed * dt * 4;
    if (w.userData.isFront) w.rotation.y = -steer * 0.5;
  }

  const targetTilt = -car.speed * 0.008 * Math.min(1, Math.abs(steer));
  carGroup.rotation.z += (targetTilt - carGroup.rotation.z) * 0.1;

  if (isDrifting && Math.random() < 0.6) {
    const backX = car.x - Math.sin(car.angle) * 1.2;
    const backZ = car.z - Math.cos(car.angle) * 1.2;
    const sideX = Math.cos(car.angle) * 0.9;
    const sideZ = -Math.sin(car.angle) * 0.9;
    addSkidMark(backX + sideX, backZ + sideZ, car.angle);
    addSkidMark(backX - sideX, backZ - sideZ, car.angle);
  }

  for (let i = skidMarks.length - 1; i >= 0; i--) {
    skidMarks[i].life -= 1;
    skidMarks[i].mesh.material.opacity = Math.max(0, skidMarks[i].life / 400) * 0.55;
    if (skidMarks[i].life <= 0) {
      scene.remove(skidMarks[i].mesh);
      skidMarks.splice(i, 1);
    }
  }

  updateEngineSound();
  updateTireSound(isDrifting);

  const speedEl = document.getElementById('speed');
  if (speedEl) speedEl.innerHTML = Math.round(speedAbs * 3.6) + '<small>км/ч</small>';
}

function updateCamera() {
  const camOffset = { x: 0, y: 5.5, z: -9 };
  const cos = Math.cos(car.angle), sin = Math.sin(car.angle);
  const tx = car.x + camOffset.x * cos + camOffset.z * sin;
  const ty = camOffset.y;
  const tz = car.z - camOffset.x * sin + camOffset.z * cos;
  camera.position.x += (tx - camera.position.x) * 0.12;
  camera.position.y += (ty - camera.position.y) * 0.12;
  camera.position.z += (tz - camera.position.z) * 0.12;
  const lookX = car.x + Math.sin(car.angle) * 4;
  const lookZ = car.z + Math.cos(car.angle) * 4;
  camera.lookAt(lookX, 1.2, lookZ);
}

function drawButtons() {
  for (const b of allButtons) {
    if (!b.visible) continue;
    const isHover = menuHover === b;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, b.x - b.w/2 + 4, b.y - b.h/2 + 4, b.w, b.h, 12);
    ctx.fill();
    const grad = ctx.createLinearGradient(0, b.y - b.h/2, 0, b.y + b.h/2);
    if (isHover) { grad.addColorStop(0, lighten(b.color, 40)); grad.addColorStop(1, b.color); }
    else { grad.addColorStop(0, b.color); grad.addColorStop(1, darken(b.color, 30)); }
    ctx.fillStyle = grad;
    roundRect(ctx, b.x - b.w/2, b.y - b.h/2, b.w, b.h, 12);
    ctx.fill();
    ctx.strokeStyle = isHover ? '#fff' : 'rgba(0,0,0,0.6)';
    ctx.lineWidth = isHover ? 3 : 2;
    roundRect(ctx, b.x - b.w/2, b.y - b.h/2, b.w, b.h, 12);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.text, b.x, b.y + 2);
  }
}

function lighten(hex, amt) {
  const c = hex.replace('#','');
  const r = Math.min(255, parseInt(c.substr(0,2),16) + amt);
  const g = Math.min(255, parseInt(c.substr(2,2),16) + amt);
  const b = Math.min(255, parseInt(c.substr(4,2),16) + amt);
  return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

function darken(hex, amt) {
  const c = hex.replace('#','');
  const r = Math.max(0, parseInt(c.substr(0,2),16) - amt);
  const g = Math.max(0, parseInt(c.substr(2,2),16) - amt);
  const b = Math.max(0, parseInt(c.substr(4,2),16) - amt);
  return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

  ctx.fillText('🎮 УПРАВЛЕНИЕ', w/2, h*0.13);

  const x1 = w * 0.15, y0 = h * 0.3, lineH = 42;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 26px Arial';
  ctx.fillText('💻 На компьютере:', x1, y0);
  ctx.fillStyle = '#fff'; ctx.font = '20px Arial';
  ctx.fillText('W A S D — ехать', x1, y0 + lineH * 1.2);
  ctx.fillText('Стрелки — тоже ехать', x1, y0 + lineH * 2.0);
  ctx.fillText('Пробел — гудок', x1, y0 + lineH * 2.8);
  ctx.fillText('Esc — пауза', x1, y0 + lineH * 3.6);

  const x2 = w * 0.55;
  ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 26px Arial';
  ctx.fillText('📱 На телефоне:', x2, y0);
  ctx.fillStyle = '#fff'; ctx.font = '20px Arial';
  ctx.fillText('Джойстик слева — ехать', x2, y0 + lineH * 1.2);
  ctx.fillText('Кнопка 📣 — гудок', x2, y0 + lineH * 2.0);
  ctx.fillText('Кнопка ⏸ — пауза', x2, y0 + lineH * 2.8);

  drawButtons();
}

function layoutRecords() {
  clearButtons();
  const w = uiCanvas.width, h = uiCanvas.height;
  const bw = Math.min(300, w * 0.5);
  makeButton('back', '← НАЗАД', w/2, h - 60, bw * 0.7, 50, '#333', () => {
    clickSound(); state = 'menu'; layoutMenu();
  });
}

function drawRecords() {
  drawMenuBg();
  const w = uiCanvas.width, h = uiCanvas.height;
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold ' + Math.min(48, w*0.1) + 'px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏆 РЕКОРДЫ', w/2, h*0.13);

  ctx.textAlign = 'left';
  const x = w * 0.2;
  let y = h * 0.3;
  ctx.font = 'bold 22px Arial';

  ctx.fillStyle = '#fff'; ctx.fillText('Макс. скорость:', x, y);
  ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'right';
  ctx.fillText(Math.round(records.bestSpeed * 3.6) + ' км/ч', w*0.8, y);
  y += 45; ctx.textAlign = 'left';

  ctx.fillStyle = '#fff'; ctx.fillText('Лучшее время:', x, y);
  ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'right';
  const bt = records.bestTime || 0;
  ctx.fillText(Math.floor(bt/60) + ':' + String(Math.floor(bt%60)).padStart(2,'0'), w*0.8, y);
  y += 45; ctx.textAlign = 'left';

  ctx.fillStyle = '#fff'; ctx.fillText('Дистанция:', x, y);
  ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'right';
  ctx.fillText(Math.round(records.bestDistance) + ' м', w*0.8, y);
  y += 60; ctx.textAlign = 'left';

  ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Arial';
  ctx.fillText('Лучшие заезды:', x, y);
  y += 40;
  ctx.font = '20px Arial';

  if (!records.topScores || records.topScores.length === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('Пока нет — играй!', x, y);
  } else {
    records.topScores.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#ffd700' : '#fff';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '  ';
      ctx.fillText(medal + ' Заезд ' + (i+1) + ': ' + Math.round(s.speed*3.6) + ' км/ч, ' + Math.round(s.distance) + ' м', x, y);
      y += 30;
    });
  }

  drawButtons();
}

function drawMenuBg() {
  const w = uiCanvas.width, h = uiCanvas.height;
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#1e3c72');
  grad.addColorStop(1, '#2a5298');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, w, h);
}

function layoutPause() {
  clearButtons();
  const w = uiCanvas.width, h = uiCanvas.height;
  const bw = Math.min(300, w * 0.5);
  const bh = 55;
  const cx = w / 2;
  const startY = h * 0.35;

  makeButton('resume', '▶  ПРОДОЛЖИТЬ', cx, startY, bw, bh, '#06d6a0', () => {
    clickSound(); state = 'playing';
    if (audioCtx) audioCtx.resume();
  });
  makeButton('restart', '🔄  ЗАНОВО', cx, startY + bh + 12, bw, bh, '#f77f00', () => { clickSound(); startGame(); });
  makeButton('menu', '🏠  В МЕНЮ', cx, startY + (bh + 12) * 2, bw, bh, '#457b9d', () => { clickSound(); state = 'menu'; layoutMenu(); });
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, uiCanvas.width, uiCanvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.min(60, uiCanvas.width*0.12) + 'px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⏸ ПАУЗА', uiCanvas.width/2, uiCanvas.height * 0.2);
  drawButtons();
}

function layoutGameOver() {
  clearButtons();
  const w = uiCanvas.width, h = uiCanvas.height;
  const bw = Math.min(280, w * 0.45);
  const bh = 50;
  const cx = w / 2;

  makeButton('restart', '🔄  ЕЩЁ РАЗ', cx, h * 0.75, bw, bh, '#06d6a0', () => { clickSound(); startGame(); });
  makeButton('menu', '🏠  В МЕНЮ', cx, h * 0.75 + bh + 12, bw, bh, '#457b9d', () => { clickSound(); state = 'menu'; layoutMenu(); });
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, uiCanvas.width, uiCanvas.height);

  const w = uiCanvas.width, h = uiCanvas.height;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = 'bold ' + Math.min(56, w*0.12) + 'px Arial';
  ctx.fillStyle = '#000';
  ctx.fillText('ЗАЕЗД ОКОНЧЕН', w/2 + 3, h*0.15 + 3);
  const grad = ctx.createLinearGradient(0, h*0.07, 0, h*0.18);
  grad.addColorStop(0, '#ffcc00');
  grad.addColorStop(1, '#e63946');
  ctx.fillStyle = grad;
  ctx.fillText('ЗАЕЗД ОКОНЧЕН', w/2, h*0.15);

  ctx.font = 'bold 22px Arial';
  const x = w * 0.25;
  let y = h * 0.28;

  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText('⏱  Время:', x, y);
  ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'right';
  ctx.fillText(Math.floor(gameTime/60) + ':' + String(Math.floor(gameTime%60)).padStart(2,'0'), w*0.75, y);
  y += 35;

  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText('💨 Макс. скорость:', x, y);
  ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'right';
  ctx.fillText(Math.round(maxSpeedReached * 3.6) + ' км/ч', w*0.75, y);
  y += 35;

  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText('📏 Дистанция:', x, y);
  ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'right';
  ctx.fillText(Math.round(distanceDriven) + ' м', w*0.75, y);
  y += 50;

  let newRecord = false;
  if (maxSpeedReached > records.bestSpeed) { records.bestSpeed = maxSpeedReached; newRecord = true; }
  if (gameTime > records.bestTime) { records.bestTime = gameTime; newRecord = true; }
  if (distanceDriven > records.bestDistance) { records.bestDistance = distanceDriven; newRecord = true; }
  if (!records.topScores) records.topScores = [];
  records.topScores.push({ speed: maxSpeedReached, distance: distanceDriven, time: gameTime });
  records.topScores.sort((a, b) => b.speed - a.speed);
  records.topScores = records.topScores.slice(0, 5);
  saveRecords();

  if (newRecord) {
    ctx.font = 'bold 32px Arial';
    ctx.fillStyle = '#ffd700';
    ctx.textAlign = 'center';
    const pulse = 0.8 + 0.2 * Math.sin(performance.now() / 200);
    ctx.globalAlpha = pulse;
    ctx.fillText('✨ НОВЫЙ РЕКОРД! ✨', w/2, h*0.62);
    ctx.globalAlpha = 1;
  }

  drawButtons();
}

let uiCanvas, uiCtx, ctx;

function initUI() {
  uiCanvas = document.createElement('canvas');
  Object.assign(uiCanvas.style, { position: 'fixed', inset: '0', pointerEvents: 'auto', touchAction: 'none', zIndex: 10 });
  uiCanvas.width = innerWidth;
  uiCanvas.height = innerHeight;
  document.body.appendChild(uiCanvas);
  uiCtx = uiCanvas.getContext('2d');
  ctx = uiCtx;

  uiCanvas.addEventListener('mousemove', e => {
    const r = uiCanvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    menuHover = getBtnAt(mouse.x, mouse.y);
  });
  uiCanvas.addEventListener('mousedown', e => {
    initAudio();
    const r = uiCanvas.getBoundingClientRect();
    const mx = e.clientX - r.left;
    const my = e.clientY - r.top;
    const b = getBtnAt(mx, my);
    if (b) b.onClick();
    if (state === 'playing' && Math.hypot(mx - honkBtn.x, my - honkBtn.y) < honkBtn.r) {
      honk(); honkBtn.active = true;
    }
  });
  uiCanvas.addEventListener('mouseup', () => { honkBtn.active = false; });

  uiCanvas.addEventListener('touchstart', onTouchStart, { passive: false });
  uiCanvas.addEventListener('touchmove', onTouchMove, { passive: false });
  uiCanvas.addEventListener('touchend', onTouchEnd, { passive: false });
  uiCanvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

  updateHonkBtnPos();
  addEventListener('resize', () => {
    uiCanvas.width = innerWidth;
    uiCanvas.height = innerHeight;
    updateHonkBtnPos();
    if (state === 'menu') layoutMenu();
    else if (state === 'settings') layoutSettings();
    else if (state === 'controls') layoutControls();
    else if (state === 'records') layoutRecords();
    else if (state === 'paused') layoutPause();
    else if (state === 'gameover') layoutGameOver();
  });
}

const joystick = {
  active: false, id: null,
  baseX: 0, baseY: 0, knobX: 0, knobY: 0,
  maxRadius: 70, dx: 0, dy: 0, visible: false,
};

const honkBtn = { x: 0, y: 0, r: 35, active: false };
const pauseBtn = { x: 0, y: 0, r: 28, active: false };

function updateHonkBtnPos() {
  honkBtn.x = innerWidth - 60;
  honkBtn.y = innerHeight - 60;
  pauseBtn.x = innerWidth - 60;
  pauseBtn.y = 60;
}

function onTouchStart(e) {
  initAudio();
  for (const t of e.changedTouches) {
    const mx = t.clientX, my = t.clientY;

    if (state !== 'playing') {
      const b = getBtnAt(mx, my);
      if (b) { b.onClick(); e.preventDefault(); continue; }
    }

    if (state === 'playing') {
      if (Math.hypot(mx - honkBtn.x, my - honkBtn.y) < honkBtn.r + 10) {
        honk(); honkBtn.active = true;
        e.preventDefault(); continue;
      }
      if (Math.hypot(mx - pauseBtn.x, my - pauseBtn.y) < pauseBtn.r + 10) {
        state = 'paused'; layoutPause();
        e.preventDefault(); continue;
      }
      if (!joystick.active) {
        joystick.active = true;
        joystick.id = t.identifier;
        joystick.baseX = mx;
        joystick.baseY = my;
        joystick.knobX = mx;
        joystick.knobY = my;
        joystick.visible = true;
        e.preventDefault();
      }
    }
  }
}

function onTouchMove(e) {
  if (!joystick.active) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      let dx = t.clientX - joystick.baseX;
      let dy = t.clientY - joystick.baseY;
      const d = Math.hypot(dx, dy);
      if (d > joystick.maxRadius) { dx = dx / d * joystick.maxRadius; dy = dy / d * joystick.maxRadius; }
      joystick.knobX = joystick.baseX + dx;
      joystick.knobY = joystick.baseY + dy;
      joystick.dx = dx / joystick.maxRadius;
      joystick.dy = dy / joystick.maxRadius;
      e.preventDefault();
    }
  }
}

function onTouchEnd(e) {
  if (!joystick.active) { honkBtn.active = false; return; }
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      joystick.active = false; joystick.id = null;
      joystick.dx = 0; joystick.dy = 0; joystick.visible = false;
    }
  }
  honkBtn.active = false;
}

function drawGameUI() {
  uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
  if (state !== 'playing' && state !== 'paused') return;

  if (joystick.active && joystick.visible) {
    uiCtx.globalAlpha = 0.35;
    uiCtx.fillStyle = '#000';
    uiCtx.beginPath(); uiCtx.arc(joystick.baseX, joystick.baseY, joystick.maxRadius, 0, Math.PI*2); uiCtx.fill();
    uiCtx.strokeStyle = '#fff'; uiCtx.lineWidth = 3; uiCtx.stroke();

    uiCtx.globalAlpha = 0.85;
    const grad = uiCtx.createRadialGradient(joystick.knobX, joystick.knobY, 0, joystick.knobX, joystick.knobY, joystick.maxRadius * 0.45);
    grad.addColorStop(0, '#ffcc00'); grad.addColorStop(1, '#e63946');
    uiCtx.fillStyle = grad;
    uiCtx.beginPath(); uiCtx.arc(joystick.knobX, joystick.knobY, joystick.maxRadius * 0.45, 0, Math.PI*2); uiCtx.fill();
    uiCtx.strokeStyle = '#fff'; uiCtx.lineWidth = 2; uiCtx.stroke();
    uiCtx.globalAlpha = 1;
  } else if (IS_MOBILE) {
    const hx = innerWidth * 0.25, hy = innerHeight * 0.78, r = joystick.maxRadius;
    uiCtx.globalAlpha = 0.22;
    uiCtx.strokeStyle = '#fff'; uiCtx.lineWidth = 3;
    uiCtx.beginPath(); uiCtx.arc(hx, hy, r, 0, Math.PI*2); uiCtx.stroke();
    uiCtx.globalAlpha = 0.6;
    uiCtx.fillStyle = '#fff'; uiCtx.font = 'bold 14px Arial';
    uiCtx.textAlign = 'center';
    uiCtx.fillText('ДЖОЙСТИК', hx, hy + r + 24);
    uiCtx.globalAlpha = 1;
  }

  uiCtx.globalAlpha = honkBtn.active ? 0.9 : 0.6;
  uiCtx.fillStyle = honkBtn.active ? '#ffcc00' : '#000';
  uiCtx.beginPath(); uiCtx.arc(honkBtn.x, honkBtn.y, honkBtn.r, 0, Math.PI*2); uiCtx.fill();
  uiCtx.strokeStyle = '#fff'; uiCtx.lineWidth = 2; uiCtx.stroke();
  uiCtx.globalAlpha = 1;
  uiCtx.fillStyle = honkBtn.active ? '#000' : '#fff';
  uiCtx.font = 'bold 22px Arial';
  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';
  uiCtx.fillText('📣', honkBtn.x, honkBtn.y + 1);

  uiCtx.globalAlpha = 0.6;
  uiCtx.fillStyle = '#000';
  uiCtx.beginPath(); uiCtx.arc(pauseBtn.x, pauseBtn.y, pauseBtn.r, 0, Math.PI*2); uiCtx.fill();
  uiCtx.strokeStyle = '#fff'; uiCtx.lineWidth = 2; uiCtx.stroke();
  uiCtx.globalAlpha = 1;
  uiCtx.fillStyle = '#fff';
  uiCtx.fillRect(pauseBtn.x - 7, pauseBtn.y - 9, 4, 18);
  uiCtx.fillRect(pauseBtn.x + 3, pauseBtn.y - 9, 4, 18);

  const timeStr = Math.floor(gameTime/60) + ':' + String(Math.floor(gameTime%60)).padStart(2,'0');
  uiCtx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(uiCtx, uiCanvas.width/2 - 60, 15, 120, 40, 10);
  uiCtx.fill();
  uiCtx.fillStyle = '#fff';
  uiCtx.font = 'bold 24px Arial';
  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';
  uiCtx.fillText(timeStr, uiCanvas.width/2, 35);
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function startGame() {
  resetCar();
  gameTime = 0;
  maxSpeedReached = 0;
  distanceDriven = 0;
  state = 'playing';
  const sp = document.getElementById('speed');
  if (sp) sp.style.display = 'block';
}

function endGame() {
  state = 'gameover';
  layoutGameOver();
  const sp = document.getElementById('speed');
  if (sp) sp.style.display = 'none';
}

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state === 'playing') {
    updateCar(dt);
    updateCamera();
    gameTime += dt;
    if (gameTime >= 180) endGame();
  } else if (state === 'paused' || state === 'gameover') {
    // Стоит
  } else {
    if (camera && carGroup) {
      const t = now / 3000;
      camera.position.x = Math.sin(t) * 25;
      camera.position.z = Math.cos(t) * 25;
      camera.position.y = 12;
      camera.lookAt(0, 1, 0);
    }
  }

  renderer.render(scene, camera);

  if (state === 'splash') drawSplash();
  else if (state === 'menu') { menuHover = getBtnAt(mouse.x, mouse.y); drawMenu(); }
  else if (state === 'settings') { menuHover = getBtnAt(mouse.x, mouse.y); drawSettings(); }
  else if (state === 'controls') { menuHover = getBtnAt(mouse.x, mouse.y); drawControls(); }
  else if (state === 'records') { menuHover = getBtnAt(mouse.x, mouse.y); drawRecords(); }
  else if (state === 'playing') drawGameUI();
  else if (state === 'paused') { drawGameUI(); drawPause(); }
  else if (state === 'gameover') drawGameOver();
}

function onResize() {
  if (camera) {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
}

init3D();
initUI();
splashStart = performance.now();

addEventListener('keydown', e => {
  initAudio();
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Escape') {
    if (state === 'playing') { state = 'paused'; layoutPause(); }
    else if (state === 'paused') { state = 'playing'; }
  }
  if (e.key === ' ' && state === 'playing') honk();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

animate();
</script>
