<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Машина-Обжора</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: #111;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrap {
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<script>
  // ============================================
  //   БАЗА
  // ============================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Адаптивный размер: подстраиваемся под экран телефона/ПК
  let W = 900, H = 650;
  function resize() {
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const ratio = 900 / 650;
    if (maxW / maxH > ratio) {
      H = maxH; W = H * ratio;
    } else {
      W = maxW; H = W / ratio;
    }
    canvas.width = Math.floor(W);
    canvas.height = Math.floor(H);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  // Мобильное устройство?
  const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const IS_MOBILE = IS_TOUCH && Math.min(window.innerWidth, window.innerHeight) < 900;

  const TILE = 32;
  const WORLD_W = 50 * TILE;
  const WORLD_H = 50 * TILE;

  let state = 'menu';
  let loadStart = 0;
  const LOAD_DURATION = 2200;

  let settings = { sound: true, music: true, difficulty: 'normal' };
  try { const s = localStorage.getItem('carEaterSettings'); if (s) settings = Object.assign(settings, JSON.parse(s)); } catch(e){}
  function saveSettings() { try { localStorage.setItem('carEaterSettings', JSON.stringify(settings)); } catch(e){} }

  let highScore = 0;
  try { highScore = parseInt(localStorage.getItem('carEaterHighScore') || '0'); } catch(e){}
  function saveHighScore(s) {
    if (s > highScore) { highScore = s; try { localStorage.setItem('carEaterHighScore', s); } catch(e){} }
  }

  // ============================================
  //   ЗВУК
  // ============================================
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, dur, type='sine', vol=0.15) {
    if (!settings.sound || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }
  function sfxApple()   { playTone(800,0.12,'square',0.12); setTimeout(()=>playTone(1200,0.1,'square',0.1),60); }
  function sfxCoin()    { playTone(1500,0.1,'sine',0.13); setTimeout(()=>playTone(2000,0.12,'sine',0.11),70); }
  function sfxFuel()    { playTone(300,0.15,'sawtooth',0.1); }
  function sfxHit()     { playTone(120,0.25,'sawtooth',0.2); }
  function sfxClick()   { playTone(600,0.05,'square',0.08); }
  function sfxGameOver(){ playTone(400,0.2,'sawtooth',0.15); setTimeout(()=>playTone(300,0.3,'sawtooth',0.15),200); setTimeout(()=>playTone(200,0.5,'sawtooth',0.15),500); }

  // ============================================
  //   МЕНЮ
  // ============================================
  const menuButtons = [
    { id: 'play',     text: '▶  ИГРАТЬ',    x: 140, y: 220, w: 220, h: 60 },
    { id: 'settings', text: '⚙  НАСТРОЙКИ', x: 140, y: 310, w: 220, h: 60 },
    { id: 'exit',     text: '✖  ВЫХОД',     x: 140, y: 400, w: 220, h: 60 },
  ];
  const settingsButtons = [
    { id:'sound', x: 580, y: 180, w: 200, h: 50, type:'toggle', key:'sound', label:'🔊 Звуки' },
    { id:'music', x: 580, y: 250, w: 200, h: 50, type:'toggle', key:'music', label:'🎵 Музыка' },
    { id:'diffEasy',   text:'ЛЕГКО',  x: 480, y: 340, w: 130, h: 50, type:'diff', val:'easy' },
    { id:'diffNormal', text:'НОРМА',  x: 620, y: 340, w: 130, h: 50, type:'diff', val:'normal' },
    { id:'diffHard',   text:'СЛОЖНО', x: 760, y: 340, w: 130, h: 50, type:'diff', val:'hard' },
    { id:'back',       text:'← НАЗАД', x: 130, y: 580, w: 200, h: 55, type:'back' },
    { id:'clearHS',    text:'🗑 Сброс рекорда', x: 620, y: 470, w: 220, h: 50, type:'clear' },
  ];

  let mouse = { x: 0, y: 0 };
  let hoveredButton = null;

  // Универсальный обработчик координат (мышь + палец)
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX; cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length) {
      cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
    } else {
      cx = e.clientX; cy = e.clientY;
    }
    // Масштаб между CSS размером и внутренним
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (cx - rect.left) * scaleX,
      y: (cy - rect.top) * scaleY,
    };
  }

  canvas.addEventListener('mousemove', e => {
    const p = getPos(e); mouse.x = p.x; mouse.y = p.y;
  });

  canvas.addEventListener('click', e => {
    initAudio();
    if (state === 'playing') return;
    if (hoveredButton) handleClick(hoveredButton);
  });

  // Отдельно касания
  canvas.addEventListener('touchstart', e => {
    initAudio();
    const p = getPos(e); mouse.x = p.x; mouse.y = p.y;

    // Если на паузе и есть кнопки - обработать
    if (state === 'menu' || state === 'settings' || state === 'gameover') {
      // Найти кнопку
      hoveredButton = findButtonAt(p.x, p.y);
      if (hoveredButton) {
        e.preventDefault();
        handleClick(hoveredButton);
      }
    }
  }, { passive: false });

  function findButtonAt(x, y) {
    let list = [];
    if (state === 'menu') list = menuButtons;
    else if (state === 'settings') list = settingsButtons;
    else if (state === 'gameover') list = gameOverButtons;
    for (const b of list) {
      if (x > b.x - b.w/2 && x < b.x + b.w/2 && y > b.y - b.h/2 && y < b.y + b.h/2) return b;
    }
    return null;
  }

  function handleClick(btn) {
    sfxClick();
    if (state === 'menu') {
      if (btn.id === 'play') { state = 'loading'; loadStart = Date.now(); }
      if (btn.id === 'settings') state = 'settings';
      if (btn.id === 'exit') {
        document.body.innerHTML = '<h1 style="color:#fff;text-align:center;margin-top:40vh;font-family:Arial">До встречи! 👋</h1>';
      }
    } else if (state === 'settings') {
      if (btn.type === 'toggle') { settings[btn.key] = !settings[btn.key]; saveSettings(); }
      else if (btn.type === 'diff') { settings.difficulty = btn.val; saveSettings(); }
      else if (btn.type === 'back') state = 'menu';
      else if (btn.type === 'clear') {
        highScore = 0;
        try { localStorage.removeItem('carEaterHighScore'); } catch(e){}
      }
    } else if (state === 'gameover') {
      if (btn.id === 'restart') { state = 'loading'; loadStart = Date.now(); }
      if (btn.id === 'toMenu') { state = 'menu'; }
    }
  }

  // ============================================
  //   МИР
  // ============================================
  let world = [], food = [], enemies = [], particles = [];
  let car = null;
  let camera = { x: 0, y: 0 };
  let gameTime = 0;
  const ROUND_TIME = 120;
  let shake = 0;
  let toast = null;

  function generateWorld() {
    world = []; food = []; enemies = []; particles = [];

    for (let y = 0; y < 50; y++) {
      world[y] = [];
      for (let x = 0; x < 50; x++) world[y][x] = 0;
    }
    const cx = 25, cy = 25;
    for (let i = 0; i < 50; i++) { world[cy][i] = 1; world[i][cx] = 1; }
    for (let i = 5; i < 45; i++) { world[10][i] = 1; world[i][40] = 1; }
    for (let y = 3; y < 10; y++) for (let x = 3; x < 10; x++) world[y][x] = 2;
    const houses = [{ x: 42, y: 42, w: 4, h: 3 }, { x: 42, y: 35, w: 3, h: 4 }];
    for (const h of houses) {
      for (let y = h.y; y < h.y + h.h; y++)
        for (let x = h.x; x < h.x + h.w; x++) world[y][x] = 6;
    }
    let placed = 0;
    while (placed < 250) {
      const x = Math.floor(Math.random() * 50);
      const y = Math.floor(Math.random() * 50);
      if (world[y][x] === 0) {
        world[y][x] = Math.random() < 0.6 ? 3 : (Math.random() < 0.5 ? 4 : 5);
        placed++;
      }
    }
    for (let i = 0; i < 70; i++) spawnFood();
  }

  function spawnFood() {
    let tries = 0;
    while (tries < 50) {
      const x = Math.floor(Math.random() * 50);
      const y = Math.floor(Math.random() * 50);
      if (world[y][x] === 0 || world[y][x] === 1) {
        const r = Math.random();
        let type = 'apple';
        if (r > 0.75) type = 'fuel';
        else if (r > 0.45) type = 'coin';
        food.push({ x: x*TILE + TILE/2, y: y*TILE + TILE/2, type, size: 12, alive: true });
        return;
      }
      tries++;
    }
  }

  function createCar() {
    return {
      x: 25*TILE + TILE/2, y: 25*TILE + TILE/2,
      size: 30, speed: 3.2, baseSpeed: 3.2, angle: 0,
      score: 0, hp: 100, maxHp: 100,
      fuel: 100, maxFuel: 100, invuln: 0,
    };
  }

  function spawnEnemy() {
    const diff = settings.difficulty;
    let count = diff === 'easy' ? 2 : diff === 'hard' ? 6 : 4;
    const speedBase = diff === 'easy' ? 1.6 : diff === 'hard' ? 3.0 : 2.2;
    for (let i = 0; i < count; i++) {
      let ex, ey, tries = 0;
      do {
        ex = Math.random() * WORLD_W;
        ey = Math.random() * WORLD_H;
        tries++;
      } while (Math.hypot(ex - car.x, ey - car.y) < 400 && tries < 50);
      enemies.push({
        x: ex, y: ey, size: 28,
        speed: speedBase + Math.random() * 0.6,
        angle: 0, hp: 3,
        color: ['#2a9d8f','#7209b7','#f77f00','#457b9d','#8d99ae','#e07a5f'][i%6],
      });
    }
  }

  // ============================================
  //   ВИРТУАЛЬНЫЙ ДЖОЙСТИК
  // ============================================
  const joystick = {
    active: false,
    id: null,        // идентификатор касания (чтобы не путать с другими)
    baseX: 0, baseY: 0,
    knobX: 0, knobY: 0,
    maxRadius: 70,
    dx: 0, dy: 0,    // нормализованное направление (-1..1)
    visible: false,
    radius: 70,      // динамически меняется
  };

  function joystickSize() {
    // Радиус джойстика — 18% от меньшей стороны, но не больше 90 и не меньше 55
    const r = Math.min(W, H) * 0.18;
    return Math.max(55, Math.min(90, r));
  }

  // Показать джойстик там, где палец коснулся левой половины
  canvas.addEventListener('touchstart', e => {
    if (state !== 'playing') return;
    for (const t of e.changedTouches) {
      const p = getPos({ touches: [t] });
      // Левая половина экрана — джойстик
      if (p.x < W/2 && !joystick.active) {
        joystick.active = true;
        joystick.id = t.identifier;
        joystick.baseX = p.x;
        joystick.baseY = p.y;
        joystick.knobX = p.x;
        joystick.knobY = p.y;
        joystick.radius = joystickSize();
        joystick.maxRadius = joystick.radius;
        joystick.visible = true;
        e.preventDefault();
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    if (!joystick.active) return;
    for (const t of e.changedTouches) {
      if (t.identifier === joystick.id) {
        const p = getPos({ touches: [t] });
        let dx = p.x - joystick.baseX;
        let dy = p.y - joystick.baseY;
        const dist = Math.hypot(dx, dy);
        if (dist > joystick.maxRadius) {
          dx = dx / dist * joystick.maxRadius;
          dy = dy / dist * joystick.maxRadius;
        }
        joystick.knobX = joystick.baseX + dx;
        joystick.knobY = joystick.baseY + dy;
        // Нормализуем
        joystick.dx = dx / joystick.maxRadius;
        joystick.dy = dy / joystick.maxRadius;
        e.preventDefault();
      }
    }
  }, { passive: false });

  function endTouch(e) {
    if (!joystick.active) return;
    for (const t of e.changedTouches) {
      if (t.identifier === joystick.id) {
        joystick.active = false;
        joystick.id = null;
        joystick.dx = 0; joystick.dy = 0;
        joystick.visible = false;
      }
    }
  }
  canvas.addEventListener('touchend', endTouch);
  canvas.addEventListener('touchcancel', endTouch);

  // Пауза-кнопка (в правом верхнем углу — для мобилы)
  const pauseBtn = { x: 0, y: 0, w: 60, h: 60, visible: false };
  function updatePauseBtn() {
    pauseBtn.x = W - 40;
    pauseBtn.y = H - 40;
    pauseBtn.w = 60; pauseBtn.h = 60;
    pauseBtn.visible = IS_MOBILE;
  }
  updatePauseBtn();
  window.addEventListener('resize', updatePauseBtn);

  canvas.addEventListener('touchstart', e => {
    if (state !== 'playing' || !pauseBtn.visible) return;
    for (const t of e.changedTouches) {
      const p = getPos({ touches: [t] });
      if (Math.hypot(p.x - pauseBtn.x, p.y - pauseBtn.y) < 40) {
        state = 'paused';
        e.preventDefault();
      }
    }
  }, { passive: false });

  // ============================================
  //   ВВОД С КЛАВИАТУРЫ
  // ============================================
  const keys = {};
  document.addEventListener('keydown', e => {
    initAudio();
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'Escape') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
      else if (state === 'settings') state = 'menu';
    }
    if (e.key === ' ') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
  });
  document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  // ============================================
  //   ОБНОВЛЕНИЕ
  // ============================================
  function update() {
    if (state !== 'playing') return;

    gameTime += 1/60;
    if (gameTime >= ROUND_TIME) { endGame(); return; }

    // Управление
    let dx = 0, dy = 0;
    if (keys['arrowup']    || keys['w'] || keys['ц']) dy -= 1;
    if (keys['arrowdown']  || keys['s'] || keys['ы']) dy += 1;
    if (keys['arrowleft']  || keys['a'] || keys['ф']) dx -= 1;
    if (keys['arrowright'] || keys['d'] || keys['в']) dx += 1;

    // Джойстик
    if (joystick.active) {
      dx = joystick.dx;
      dy = joystick.dy;
      // Мёртвая зона
      if (Math.hypot(dx, dy) < 0.15) { dx = 0; dy = 0; }
    }

    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      const ndx = dx / len;
      const ndy = dy / len;
      // Сила наклона для скорости (на джойстике), на клавиатуре — всегда полная
      let intensity = 1;
      if (joystick.active) intensity = Math.min(1, Math.hypot(dx, dy));

      const newX = car.x + ndx * car.speed * intensity;
      const newY = car.y + ndy * car.speed * intensity;
      if (isWalkable(newX, car.y)) car.x = newX;
      if (isWalkable(car.x, newY)) car.y = newY;
      car.angle = Math.atan2(ndy, ndx);
    }

    car.x = Math.max(TILE, Math.min(WORLD_W - TILE, car.x));
    car.y = Math.max(TILE, Math.min(WORLD_H - TILE, car.y));

    car.fuel -= 0.015;
    if (car.fuel <= 0) { car.fuel = 0; car.speed = Math.max(1.2, car.speed - 0.005); }
    if (car.invuln > 0) car.invuln--;

    for (const f of food) {
      if (!f.alive) continue;
      const d = Math.hypot(f.x - car.x, f.y - car.y);
      if (d < car.size/2 + f.size/2) {
        f.alive = false;
        if (f.type === 'apple') {
          car.score += 10; car.size = Math.min(car.size + 0.6, 60);
          car.hp = Math.min(car.maxHp, car.hp + 2); sfxApple();
          spawnParticles(f.x, f.y, '#e63946', 6);
        } else if (f.type === 'coin') {
          car.score += 25; car.size = Math.min(car.size + 0.3, 60);
          sfxCoin(); spawnParticles(f.x, f.y, '#ffd700', 8);
        } else if (f.type === 'fuel') {
          car.score += 5; car.fuel = Math.min(car.maxFuel, car.fuel + 25);
          sfxFuel(); spawnParticles(f.x, f.y, '#ff9900', 6);
        }
      }
    }
    if (food.filter(f => f.alive).length < 50 && Math.random() < 0.03) spawnFood();

    for (const e of enemies) {
      const dx2 = car.x - e.x, dy2 = car.y - e.y;
      const dist = Math.hypot(dx2, dy2);
      if (dist < 500) {
        const nx = dx2/dist, ny = dy2/dist;
        const newX = e.x + nx * e.speed;
        const newY = e.y + ny * e.speed;
        if (isWalkable(newX, e.y)) e.x = newX;
        if (isWalkable(e.x, newY)) e.y = newY;
        e.angle = Math.atan2(ny, nx);
      } else {
        if (!e.patrolAngle || Math.random() < 0.01) e.patrolAngle = Math.random() * Math.PI * 2;
        const nx = Math.cos(e.patrolAngle), ny = Math.sin(e.patrolAngle);
        const newX = e.x + nx * e.speed * 0.5;
        const newY = e.y + ny * e.speed * 0.5;
        if (isWalkable(newX, e.y)) e.x = newX; else e.patrolAngle = Math.PI - e.patrolAngle;
        if (isWalkable(e.x, newY)) e.y = newY; else e.patrolAngle = -e.patrolAngle;
        e.angle = Math.atan2(ny, nx);
      }

      const d = Math.hypot(e.x - car.x, e.y - car.y);
      if (d < e.size/2 + car.size/2 && car.invuln <= 0) {
        if (car.size > e.size * 1.2) {
          e.hp -= 1;
          if (e.hp <= 0) {
            const idx = enemies.indexOf(e);
            if (idx >= 0) enemies.splice(idx, 1);
            car.score += 50;
            spawnParticles(e.x, e.y, e.color, 15);
            sfxHit();
          }
        } else {
          car.hp -= 15;
          car.invuln = 60;
          car.size = Math.max(24, car.size - 3);
          shake = 12; sfxHit();
          spawnParticles(car.x, car.y, '#ff4400', 10);
          if (car.hp <= 0) { car.hp = 0; endGame(); return; }
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shake > 0) shake *= 0.9;
    if (shake < 0.3) shake = 0;
    if (toast) { toast.life--; if (toast.life <= 0) toast = null; }

    camera.x = car.x - W/2 + (Math.random()-0.5) * shake;
    camera.y = car.y - H/2 + (Math.random()-0.5) * shake;
    camera.x = Math.max(0, Math.min(WORLD_W - W, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_H - H, camera.y));
  }

  function isWalkable(x, y) {
    const tx = Math.floor(x/TILE), ty = Math.floor(y/TILE);
    if (tx < 0 || ty < 0 || tx >= 50 || ty >= 50) return false;
    const t = world[ty][tx];
    return t === 0 || t === 1;
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 4;
      particles.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 25 + Math.random()*15, maxLife: 40,
        color, size: 2 + Math.random()*3,
      });
    }
  }

  function endGame() {
    state = 'gameover';
    const isRecord = car.score > highScore;
    saveHighScore(car.score);
    if (isRecord) toast = { text: '🏆 НОВЫЙ РЕКОРД!', life: 200 };
    sfxGameOver();
  }

  // ============================================
  //   РИСОВАНИЕ
  // ============================================
  function drawGrassTile(px, py) {
    ctx.fillStyle = '#4a7c3a';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = 'rgba(90,150,60,0.7)';
    ctx.lineWidth = 1;
    const seed = (px*7 + py*13) % 100;
    for (let i = 0; i < 5; i++) {
      const x = px + ((seed*(i+1)*7) % TILE);
      const y = py + ((seed*(i+1)*11) % TILE);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x+1, y-4);
      ctx.stroke();
    }
  }
  function drawRoadTile(px, py, x, y) {
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#4a4a4a';
    for (let i = 0; i < 3; i++) {
      const s = (px*3 + py*5 + i*17) % 100;
      ctx.fillRect(px + (s%28)+2, py + ((s*3)%28)+2, 2, 2);
    }
    ctx.fillStyle = '#f1c40f';
    const isH = (y === 10 || y === 25);
    const isV = (x === 25 || x === 40);
    if (isH && !isV) ctx.fillRect(px, py + TILE/2 - 2, TILE, 4);
    else if (isV && !isH) ctx.fillRect(px + TILE/2 - 2, py, 4, TILE);
  }
  function drawWaterTile(px, py) {
    const t = Date.now()/1000;
    const wave = Math.sin(t + px*0.05 + py*0.05) * 5;
    ctx.fillStyle = `rgb(${30+wave}, ${100+wave}, ${180+wave})`;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px+4, py+12+wave*0.3);
    ctx.lineTo(px+28, py+12+wave*0.3);
    ctx.stroke();
  }
  function drawTree(px, py) {
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(px+13, py+18, 6, 14);
    ctx.fillStyle = '#2d5a1e';
    ctx.beginPath(); ctx.arc(px+16, py+16, 13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3d7a2e';
    ctx.beginPath(); ctx.arc(px+13, py+13, 9, 0, Math.PI*2); ctx.fill();
  }
  function drawBush(px, py) {
    ctx.fillStyle = '#3d6b2e';
    ctx.beginPath();
    ctx.arc(px+12, py+20, 9, 0, Math.PI*2);
    ctx.arc(px+20, py+20, 9, 0, Math.PI*2);
    ctx.arc(px+16, py+14, 9, 0, Math.PI*2);
    ctx.fill();
  }
  function drawRock(px, py) {
    ctx.fillStyle = '#7a7a7a';
    ctx.beginPath();
    ctx.moveTo(px+6, py+24);
    ctx.lineTo(px+10, py+10);
    ctx.lineTo(px+20, py+8);
    ctx.lineTo(px+26, py+16);
    ctx.lineTo(px+24, py+24);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9a9a9a';
    ctx.beginPath();
    ctx.moveTo(px+12, py+14);
    ctx.lineTo(px+18, py+12);
    ctx.lineTo(px+22, py+18);
    ctx.closePath(); ctx.fill();
  }
  function drawWall(px, py) {
    ctx.fillStyle = '#b86b3a';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = '#7a4020';
    ctx.lineWidth = 2;
    ctx.strokeRect(px+1, py+1, TILE-2, TILE-2);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, py+TILE/2);
    ctx.lineTo(px+TILE, py+TILE/2);
    ctx.moveTo(px+TILE/2, py);
    ctx.lineTo(px+TILE/2, py+TILE/2);
    ctx.moveTo(px+TILE/4, py+TILE/2);
    ctx.lineTo(px+TILE/4, py+TILE);
    ctx.stroke();
  }

  function drawFood() {
    for (const f of food) {
      if (!f.alive) continue;
      const sx = f.x - camera.x, sy = f.y - camera.y;
      if (sx < -30 || sy < -30 || sx > W+30 || sy > H+30) continue;
      if (f.type === 'apple') {
        ctx.fillStyle = '#e63946';
        ctx.beginPath(); ctx.arc(sx, sy, f.size, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2d8a1e';
        ctx.fillRect(sx-2, sy-f.size-4, 4, 6);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(sx-4, sy-4, 2.5, 0, Math.PI*2); ctx.fill();
      } else if (f.type === 'coin') {
        const pulse = 1 + Math.sin(Date.now()/150 + f.x) * 0.15;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(sx, sy, f.size*pulse, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#b8860b';
        ctx.beginPath(); ctx.arc(sx, sy, f.size*0.6*pulse, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 12px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('$', sx, sy+1);
      } else if (f.type === 'fuel') {
        ctx.fillStyle = '#e63946';
        ctx.fillRect(sx-8, sy-10, 16, 20);
        ctx.fillStyle = '#222';
        ctx.fillRect(sx-4, sy-12, 8, 3);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('F', sx, sy+1);
      }
    }
  }

  function drawCarTopDown(cx, cy, size, angle, color='#e63946', darkColor='#a4161a', roofColor='#7a1820') {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle + Math.PI/2);
    const s = size / 30;
    ctx.scale(s, s);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(0, 4, 22, 16, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = color;
    roundRect(-16, -22, 32, 44, 8); ctx.fill();
    ctx.strokeStyle = darkColor;
    ctx.lineWidth = 2;
    roundRect(-16, -22, 32, 44, 8); ctx.stroke();

    ctx.fillStyle = darkColor;
    roundRect(-13, 8, 26, 12, 4); ctx.fill();

    ctx.fillStyle = roofColor;
    roundRect(-11, -14, 22, 22, 6); ctx.fill();

    ctx.fillStyle = '#9ad0ff';
    roundRect(-10, -13, 20, 8, 3); ctx.fill();
    roundRect(-9, 2, 18, 6, 3); ctx.fill();

    ctx.fillStyle = '#fff8b0';
    ctx.beginPath(); ctx.arc(-10, -22, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -22, 3, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function drawEnemies() {
    for (const e of enemies) {
      const sx = e.x - camera.x, sy = e.y - camera.y;
      if (sx < -50 || sy < -50 || sx > W+50 || sy > H+50) continue;
      const dark = shadeColor(e.color, -50);
      const roof = shadeColor(e.color, -80);
      drawCarTopDown(sx, sy, e.size, e.angle, e.color, dark, roof);
    }
  }

  function shadeColor(hex, amt) {
    const c = hex.replace('#','');
    const r = Math.max(0, Math.min(255, parseInt(c.substr(0,2),16) + amt));
    const g = Math.max(0, Math.min(255, parseInt(c.substr(2,2),16) + amt));
    const b = Math.max(0, Math.min(255, parseInt(c.substr(4,2),16) + amt));
    return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
  }

  function drawParticles() {
    for (const p of particles) {
      const a = p.life / p.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x - camera.x, p.y - camera.y, p.size * a, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawMiniMap() {
    const size = IS_MOBILE ? 90 : 130;
    const pad = IS_MOBILE ? 8 : 12;
    const mx = W - size - pad, my = pad;

    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    roundRect(mx-4, my-4, size+8, size+8, 6); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    roundRect(mx-4, my-4, size+8, size+8, 6); ctx.stroke();

    const scale = size / 50;
    for (let y = 0; y < 50; y++) {
      for (let x = 0; x < 50; x++) {
        const t = world[y][x];
        let col = '#4a7c3a';
        if (t === 1) col = '#555';
        else if (t === 2) col = '#2878b8';
        else if (t === 3) col = '#2d5a1e';
        else if (t === 4) col = '#3d6b2e';
        else if (t === 5) col = '#7a7a7a';
        else if (t === 6) col = '#b86b3a';
        ctx.fillStyle = col;
        ctx.fillRect(mx + x*scale, my + y*scale, scale, scale);
      }
    }
    ctx.fillStyle = '#ffd700';
    for (const f of food) {
      if (!f.alive) continue;
      ctx.fillRect(mx + (f.x/TILE)*scale - 1, my + (f.y/TILE)*scale - 1, 2, 2);
    }
    for (const e of enemies) {
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(mx + (e.x/TILE)*scale, my + (e.y/TILE)*scale, 2.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#ff0040';
    ctx.beginPath();
    ctx.arc(mx + (car.x/TILE)*scale, my + (car.y/TILE)*scale, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  }

  function drawHUD() {
    // Компактный HUD для мобилы
    const w = IS_MOBILE ? 200 : 260;
    const h = IS_MOBILE ? 75 : 90;

    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    roundRect(12, 12, w, h, 10); ctx.fill();
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2;
    roundRect(12, 12, w, h, 10); ctx.stroke();

    ctx.fillStyle = '#ffcc00';
    ctx.font = `bold ${IS_MOBILE?18:22}px Arial`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('⭐ ' + car.score, 26, 34);

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${IS_MOBILE?12:14}px Arial`;
    ctx.fillText('🏆 ' + highScore, 26, 56);
    ctx.fillText('🚗 ' + Math.round(car.size), IS_MOBILE ? 110 : 130, 56);

    // HP
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    roundRect(12, 12 + h + 6, w, 24, 8); ctx.fill();
    ctx.fillStyle = '#333';
    roundRect(18, 18 + h, w-12, 12, 6); ctx.fill();
    const hpW = (car.hp / car.maxHp) * (w-12);
    const hpGrad = ctx.createLinearGradient(18, 0, 18+w-12, 0);
    hpGrad.addColorStop(0, '#e63946');
    hpGrad.addColorStop(1, '#06d6a0');
    ctx.fillStyle = hpGrad;
    roundRect(18, 18 + h, hpW, 12, 6); ctx.fill();

    // Fuel
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    roundRect(12, 12 + h + 36, w, 24, 8); ctx.fill();
    ctx.fillStyle = '#333';
    roundRect(18, 18 + h + 24, w-12, 12, 6); ctx.fill();
    const fW = (car.fuel / car.maxFuel) * (w-12);
    ctx.fillStyle = car.fuel < 20 ? '#e63946' : '#ff9900';
    roundRect(18, 18 + h + 24, fW, 12, 6); ctx.fill();

    // Таймер
    const timeLeft = Math.max(0, ROUND_TIME - gameTime);
    const tm = Math.floor(timeLeft / 60);
    const ts = Math.floor(timeLeft % 60).toString().padStart(2,'0');
    const tw = IS_MOBILE ? 90 : 140;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    roundRect(W/2 - tw/2, 12, tw, IS_MOBILE?36:44, 10); ctx.fill();
    ctx.strokeStyle = timeLeft < 20 ? '#e63946' : '#fff';
    ctx.lineWidth = 2;
    roundRect(W/2 - tw/2, 12, tw, IS_MOBILE?36:44, 10); ctx.stroke();
    ctx.fillStyle = timeLeft < 20 ? '#e63946' : '#fff';
    ctx.font = `bold ${IS_MOBILE?20:26}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(tm + ':' + ts, W/2, IS_MOBILE ? 30 : 36);

    if (!IS_MOBILE) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      roundRect(W/2 - 70, 62, 140, 30, 8); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('👾 Враги: ' + enemies.length, W/2, 78);
    }

    drawMiniMap();

    if (toast) {
      const alpha = Math.min(1, toast.life / 40);
      ctx.globalAlpha = alpha;
      ctx.font = `bold ${IS_MOBILE?32:48}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillText(toast.text, W/2 + 3, H/2 - 60 + 3);
      ctx.fillStyle = '#ffd700';
      ctx.fillText(toast.text, W/2, H/2 - 60);
      ctx.globalAlpha = 1;
    }
  }

  // ============================================
  //   ДЖОЙСТИК - ОТРИСОВКА
  // ============================================
  function drawJoystick() {
    if (!joystick.visible || !joystick.active) {
      // Показываем подсказку "двигай здесь", пока не тронул
      if (IS_MOBILE && state === 'playing' && !joystick.active) {
        const hintX = W * 0.25;
        const hintY = H * 0.78;
        const r = joystickSize();
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(hintX, hintY, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(hintX, hintY, r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ДЖОЙСТИК', hintX, hintY + r + 24);
        ctx.globalAlpha = 1;
      }
      return;
    }

    const r = joystick.maxRadius;

    // Внешний круг
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(joystick.baseX, joystick.baseY, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joystick.baseX, joystick.baseY, r, 0, Math.PI*2); ctx.stroke();

    // Стик
    ctx.globalAlpha = 0.85;
    const stickR = r * 0.45;
    const grad = ctx.createRadialGradient(joystick.knobX, joystick.knobY, 0, joystick.knobX, joystick.knobY, stickR);
    grad.addColorStop(0, '#ffcc00');
    grad.addColorStop(1, '#e63946');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(joystick.knobX, joystick.knobY, stickR, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joystick.knobX, joystick.knobY, stickR, 0, Math.PI*2); ctx.stroke();

    ctx.globalAlpha = 1;
  }

  function drawPauseButton() {
    if (!pauseBtn.visible || state !== 'playing') return;
    ctx.save();
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(pauseBtn.x, pauseBtn.y, 28, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pauseBtn.x, pauseBtn.y, 28, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(pauseBtn.x - 8, pauseBtn.y - 10, 5, 20);
    ctx.fillRect(pauseBtn.x + 3, pauseBtn.y - 10, 5, 20);
    ctx.restore();
  }

  // ============================================
  //   ЭКРАНЫ
  // ============================================
  function drawLoadingScreen() {
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, W, H);

    const elapsed = Date.now() - loadStart;
    const progress = Math.min(elapsed / LOAD_DURATION, 1);

    if (progress >= 1) {
      generateWorld();
      car = createCar();
      spawnEnemy();
      camera.x = car.x - W/2;
      camera.y = car.y - H/2;
      gameTime = 0; shake = 0; toast = null;
      state = 'playing';
      return;
    }

    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `bold ${IS_MOBILE?32:42}px Arial`;
    const pulse = 0.7 + 0.3 * Math.sin(Date.now()/200);
    ctx.fillStyle = `rgba(255,204,0,${pulse})`;
    ctx.fillText('ЗАГРУЗКА...', W/2, H*0.35);
    ctx.restore();

    const barW = Math.min(W * 0.7, 500);
    const barH = 30;
    const barX = (W - barW) / 2;
    const barY = H * 0.5;
    ctx.fillStyle = '#222';
    roundRect(barX, barY, barW, barH, 15); ctx.fill();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
    roundRect(barX, barY, barW, barH, 15); ctx.stroke();

    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, '#ffcc00'); grad.addColorStop(1, '#e63946');
    ctx.fillStyle = grad;
    roundRect(barX, barY, barW * progress, barH, 15); ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.floor(progress*100) + '%', W/2, barY + barH/2 + 1);

    const carX = barX + barW * progress;
    drawCarTopDown(carX, barY - 50, 30, -Math.PI/2);

    const phrases = ['Строим дороги...','Сажаем деревья...','Заправляем бак...','Расставляем еду...','Прогреваем двигатель...','Спавним врагов...'];
    const idx = Math.floor(elapsed / 500) % phrases.length;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `${IS_MOBILE?14:18}px Arial`;
    ctx.fillText(phrases[idx], W/2, H * 0.65);
  }

  function drawPlayingScreen() {
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(0, 0, W, H);

    const startX = Math.floor(camera.x/TILE);
    const startY = Math.floor(camera.y/TILE);
    const endX = Math.ceil((camera.x + W)/TILE);
    const endY = Math.ceil((camera.y + H)/TILE);

    for (let y = startY; y <= endY; y++) {
      for (let x = startX; x <= endX; x++) {
        if (x < 0 || y < 0 || x >= 50 || y >= 50) continue;
        const px = x*TILE - camera.x;
        const py = y*TILE - camera.y;
        const t = world[y][x];
        if (t === 0) drawGrassTile(px, py);
        else if (t === 1) drawRoadTile(px, py, x, y);
        else if (t === 2) drawWaterTile(px, py);
        else if (t === 3) { drawGrassTile(px, py); drawTree(px, py); }
        else if (t === 4) { drawGrassTile(px, py); drawBush(px, py); }
        else if (t === 5) { drawGrassTile(px, py); drawRock(px, py); }
        else if (t === 6) drawWall(px, py);
      }
    }

    drawFood();
    drawEnemies();

    const blink = car.invuln > 0 && Math.floor(Date.now()/80) % 2 === 0;
    if (!blink) drawCarTopDown(car.x - camera.x, car.y - camera.y, car.size, car.angle);

    drawParticles();
    drawHUD();
    drawJoystick();
    drawPauseButton();
  }

  const gameOverButtons = [
    { id: 'restart', text: '🔄 ЗАНОВО', x: 0, y: 0, w: 220, h: 60 },
    { id: 'toMenu',  text: '🏠 В МЕНЮ', x: 0, y: 0, w: 220, h: 60 },
  ];

  function updateGameOverButtons() {
    const gap = 20;
    gameOverButtons[0].x = W/2 - gameOverButtons[0].w/2 - 120;
    gameOverButtons[0].y = H * 0.7;
    gameOverButtons[1].x = W/2 + gameOverButtons[1].w/2 + 120 - gameOverButtons[1].w;
    gameOverButtons[1].x = W/2 + 120;
    gameOverButtons[1].y = H * 0.7;
  }

  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = `bold ${IS_MOBILE?36:64}px Arial`;
    ctx.fillStyle = '#000';
    ctx.fillText('ИГРА ОКОНЧЕНА', W/2+4, H*0.22+4);
    const grad = ctx.createLinearGradient(0, H*0.1, 0, H*0.3);
    grad.addColorStop(0, '#ffcc00'); grad.addColorStop(1, '#e63946');
    ctx.fillStyle = grad;
    ctx.fillText('ИГРА ОКОНЧЕНА', W/2, H*0.22);

    ctx.font = `bold ${IS_MOBILE?28:40}px Arial`;
    ctx.fillStyle = '#fff';
    ctx.fillText('Очки: ' + car.score, W/2, H*0.37);

    ctx.font = `bold ${IS_MOBILE?18:26}px Arial`;
    ctx.fillStyle = car.score > highScore ? '#ffd700' : '#aaa';
    ctx.fillText('🏆 Рекорд: ' + highScore, W/2, H*0.45);

    if (car.score > highScore) {
      ctx.fillStyle = '#ffd700';
      ctx.font = `bold ${IS_MOBILE?22:32}px Arial`;
      const pulse = 0.8 + 0.2 * Math.sin(Date.now()/200);
      ctx.globalAlpha = pulse;
      ctx.fillText('✨ НОВЫЙ РЕКОРД! ✨', W/2, H*0.53);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawPauseScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${IS_MOBILE?48:72}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⏸ ПАУЗА', W/2, H/2 - 30);
    ctx.font = `${IS_MOBILE?16:24}px Arial`;
    ctx.fillStyle = '#aaa';
    ctx.fillText(IS_MOBILE ? 'Нажми на экран для продолжения' : 'ESC или ПРОБЕЛ — продолжить', W/2, H/2 + 40);
  }

  canvas.addEventListener('touchstart', e => {
    if (state === 'paused') {
      // Кнопки "продолжить" нет — просто тап возвращает
      state = 'playing';
      e.preventDefault();
    }
  }, { passive: false });

  function drawGameOverButtons() {
    for (const btn of gameOverButtons) {
      const hov = mouse.x > btn.x - btn.w/2 && mouse.x < btn.x + btn.w/2 &&
                  mouse.y > btn.y - btn.h/2 && mouse.y < btn.y + btn.h/2;
      if (hov) hoveredButton = btn;

      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      roundRect(btn.x - btn.w/2 + 4, btn.y - btn.h/2 + 4, btn.w, btn.h, 12); ctx.fill();
      const g = ctx.createLinearGradient(0, btn.y - btn.h/2, 0, btn.y + btn.h/2);
      if (hov) { g.addColorStop(0, '#ffcc00'); g.addColorStop(1, '#f39c12'); }
      else { g.addColorStop(0, '#e63946'); g.addColorStop(1, '#a4161a'); }
      ctx.fillStyle = g;
      roundRect(btn.x - btn.w/2, btn.y - btn.h/2, btn.w, btn.h, 12); ctx.fill();
      ctx.strokeStyle = hov ? '#fff' : '#000';
      ctx.lineWidth = hov ? 3 : 2;
      roundRect(btn.x - btn.w/2, btn.y - btn.h/2, btn.w, btn.h, 12); ctx.stroke();
      ctx.fillStyle = hov ? '#000' : '#fff';
      ctx.font = `bold ${IS_MOBILE?18:24}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(btn.text, btn.x, btn.y + 2);
      ctx.restore();
    }
  }

  // ============================================
  //   МЕНЮ / НАСТРОЙКИ
  // ============================================
  function drawMenuBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H*0.6);
    sky.addColorStop(0, '#1e3c72'); sky.addColorStop(1, '#2a5298');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H*0.6);
    ctx.fillStyle = '#3d6b35'; ctx.fillRect(0, H*0.6, W, H*0.4);
    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(0, H*0.65, W, H*0.25);
    ctx.fillStyle = '#f1c40f';
    const offset = (Date.now()/20) % 80;
    for (let x = -80 + offset; x < W; x += 80) {
      ctx.fillRect(x, H*0.76, 40, 6);
    }
  }

  function drawPanel() {
    const grad = ctx.createLinearGradient(0, 0, 320, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0.8)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 320, H);
  }

  function drawTitle() {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.font = 'bold 46px Arial';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText('МАШИНА', 24, 104);
    ctx.fillText('ОБЖОРА', 24, 154);
    const grad = ctx.createLinearGradient(0, 60, 0, 160);
    grad.addColorStop(0, '#ffcc00'); grad.addColorStop(1, '#e63946');
    ctx.fillStyle = grad;
    ctx.fillText('МАШИНА', 20, 100);
    ctx.fillText('ОБЖОРА', 20, 150);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeText('МАШИНА', 20, 100);
    ctx.strokeText('ОБЖОРА', 20, 150);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('🏆 Рекорд: ' + highScore, 20, 200);
  }

  function drawButton(btn, hovered) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(btn.x - btn.w/2 + 4, btn.y - btn.h/2 + 4, btn.w, btn.h, 12); ctx.fill();
    const grad = ctx.createLinearGradient(0, btn.y - btn.h/2, 0, btn.y + btn.h/2);
    if (hovered) { grad.addColorStop(0, '#ffcc00'); grad.addColorStop(1, '#f39c12'); }
    else { grad.addColorStop(0, '#e63946'); grad.addColorStop(1, '#a4161a'); }
    ctx.fillStyle = grad;
    roundRect(btn.x - btn.w/2, btn.y - btn.h/2, btn.w, btn.h, 12); ctx.fill();
    ctx.strokeStyle = hovered ? '#fff' : '#000';
    ctx.lineWidth = hovered ? 3 : 2;
    roundRect(btn.x - btn.w/2, btn.y - btn.h/2, btn.w, btn.h, 12); ctx.stroke();
    ctx.fillStyle = hovered ? '#000' : '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(btn.text, btn.x, btn.y + 2);
    ctx.restore();
  }

  function drawSettingsScreen() {
    drawMenuBackground();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffcc00';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚙ НАСТРОЙКИ', W/2, 70);
    hoveredButton = null;

    for (const btn of settingsButtons) {
      if (btn.type === 'toggle') {
        const isOn = settings[btn.key];
        const hov = isHover(btn);
        if (hov) hoveredButton = btn;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(btn.label, btn.x - 260, btn.y);
        drawButton({ ...btn, text: isOn ? '✅ ВКЛ' : '❌ ВЫКЛ' }, hov);
      }
    }

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Сложность:', W/2, 320);

    for (const btn of settingsButtons) {
      if (btn.type === 'diff') {
        const isActive = settings.difficulty === btn.val;
        const hov = isHover(btn);
        if (hov) hoveredButton = btn;
        const grad = ctx.createLinearGradient(0, btn.y - btn.h/2, 0, btn.y + btn.h/2);
        if (isActive) { grad.addColorStop(0, '#06d6a0'); grad.addColorStop(1, '#028a63'); }
        else if (hov) { grad.addColorStop(0, '#ffcc00'); grad.addColorStop(1, '#f39c12'); }
        else { grad.addColorStop(0, '#555'); grad.addColorStop(1, '#333'); }
        ctx.fillStyle = grad;
        roundRect(btn.x - btn.w/2, btn.y - btn.h/2, btn.w, btn.h, 10); ctx.fill();
        ctx.strokeStyle = isActive ? '#fff' : '#000';
        ctx.lineWidth = isActive ? 3 : 2;
        roundRect(btn.x - btn.w/2, btn.y - btn.h/2, btn.w, btn.h, 10); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(btn.text, btn.x, btn.y + 2);
      }
    }

    for (const btn of settingsButtons) {
      if (btn.type === 'clear' || btn.type === 'back') {
        const hov = isHover(btn);
        if (hov) hoveredButton = btn;
        drawButton(btn, hov);
      }
    }

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Собирай еду, избегай врагов. Время — 2 минуты.', W/2, H - 40);
  }

  function isHover(btn) {
    return mouse.x > btn.x - btn.w/2 && mouse.x < btn.x + btn.w/2 &&
           mouse.y > btn.y - btn.h/2 && mouse.y < btn.y + btn.h/2;
  }

  function getHoveredMenuButton() {
    if (state !== 'menu') return null;
    for (const btn of menuButtons) if (isHover(btn)) return btn;
    return null;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Пересчёт кнопок меню при resize (для мобилы — крупнее и центрируем)
  function layoutMenuButtons() {
    if (IS_MOBILE) {
      const cx = W * 0.32;
      const bw = Math.min(220, W * 0.55);
      const bh = 55;
      menuButtons[0].x = cx; menuButtons[0].y = H * 0.42;
      menuButtons[1].x = cx; menuButtons[1].y = H * 0.42 + bh + 15;
      menuButtons[2].x = cx; menuButtons[2].y = H * 0.42 + (bh + 15) * 2;
      menuButtons.forEach(b => { b.w = bw; b.h = bh; });
    } else {
      menuButtons[0].x = 140; menuButtons[0].y = 220;
      menuButtons[1].x = 140; menuButtons[1].y = 310;
      menuButtons[2].x = 140; menuButtons[2].y = 400;
      menuButtons.forEach(b => { b.w = 220; b.h = 60; });
    }
    updateGameOverButtons();
  }
  window.addEventListener('resize', layoutMenuButtons);
  layoutMenuButtons();

  // ============================================
  //   ГЛАВНЫЙ ЦИКЛ
  // ============================================
  function loop() {
    ctx.clearRect(0, 0, W, H);
    update();

    if (state === 'menu') {
      drawMenuBackground();
      drawPanel();
      drawTitle();
      drawCarTopDown(IS_MOBILE ? W * 0.75 : 560, IS_MOBILE ? H * 0.5 : 430, IS_MOBILE ? 45 : 60, -Math.PI/2);
      hoveredButton = getHoveredMenuButton();
      menuButtons.forEach(btn => drawButton(btn, btn === hoveredButton));
      if (!IS_MOBILE) canvas.style.cursor = hoveredButton ? 'pointer' : 'default';
    } else if (state === 'settings') {
      drawSettingsScreen();
      if (!IS_MOBILE) canvas.style.cursor = hoveredButton ? 'pointer' : 'default';
    } else if (state === 'loading') {
      hoveredButton = null;
      drawLoadingScreen();
    } else if (state === 'playing') {
      drawPlayingScreen();
    } else if (state === 'paused') {
      drawPlayingScreen();
      drawPauseScreen();
    } else if (state === 'gameover') {
      drawPlayingScreen();
      drawGameOverScreen();
      hoveredButton = null;
      drawGameOverButtons();
    }
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
